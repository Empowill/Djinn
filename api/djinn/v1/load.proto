syntax = "proto3";

// The operating load slider that controls how much of the machine Djinn uses.
package djinn.v1;

import "buf/validate/validate.proto";
import "djinn/v1/options.proto";

// LoadNotch is the operating load slider notch that controls how much of the machine Djinn uses.
enum LoadNotch {
  // Not set.
  LOAD_NOTCH_UNSPECIFIED = 0;
  // Minimal load: 20% of the machine's capacity, low CPU priority.
  LOAD_NOTCH_MINIMAL = 1;
  // Light load (deprecated: maps to medium).
  LOAD_NOTCH_LIGHT = 2 [deprecated = true];
  // Medium load: default behavior, 50% of the machine's capacity, low CPU priority.
  LOAD_NOTCH_MEDIUM = 3;
  // High load: 80% of the machine's capacity, standard CPU priority.
  LOAD_NOTCH_HIGH = 4;
  // Max load: 100% of the machine's capacity, standard CPU priority.
  LOAD_NOTCH_MAX = 5;
  // Auto load: adapts operating load between minimal and the chosen notch to the load outside Djinn.
  LOAD_NOTCH_AUTO = 6;
  // Overclock load: 150% of the machine's capacity, accepts pressure, standard CPU priority.
  LOAD_NOTCH_OVERCLOCK = 7;
}

// LoadService gets and sets the machine's operating load notch.
service LoadService {
  // Show the operating load notch in effect on this machine.
  rpc Get(LoadServiceGetRequest) returns (LoadServiceGetResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Choose the operating load notch in effect on this machine.
  rpc Set(LoadServiceSetRequest) returns (LoadServiceSetResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }

  // Follow the operating load notch and live memory: engaged peak forecasts, real worker memory, and machine RAM.
  rpc Watch(LoadServiceWatchRequest) returns (stream LoadServiceWatchResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
}

message LoadServiceGetRequest {}

message LoadServiceGetResponse {
  // The notch in effect.
  LoadNotch notch = 1;
  // Whether auto mode is active.
  bool auto = 2;
  // The base rule's slots on this machine before notch scaling.
  int32 base_slots = 3;
  // Number of workers currently running.
  int32 running_workers = 4;
  // Total RAM of the machine, in bytes.
  uint64 memory_total_bytes = 5;
  // The chosen ceiling notch when auto mode is active.
  LoadNotch chosen_notch = 6;
  // Available RAM of the machine, in bytes.
  uint64 memory_available_bytes = 7;
  // Forecast memory per worker in bytes: the median of the latest finished workers' memory at worker_percentile,
  // plus the notch's margin, or the policy default.
  uint64 worker_forecast_bytes = 8;
  // The binding resource: "memory" or "cpu".
  string binding_resource = 9;
  // Worker slots allowed by CPU before notch scaling.
  int32 cpu_slots = 10;
  // Worker slots allowed by memory before notch scaling.
  int32 memory_slots = 11;
  // Number of workers currently paused.
  int32 paused_workers = 12;
  // The percentile of its memory series a worker is engaged at under this notch (machine.Policy.Percentile): 95
  // at Minimal down to 50 at Overclock; worker_forecast_bytes is the median of the latest workers' value at it.
  int32 worker_percentile = 13;
  // The same in words, like "engaged at p50 (overclock)".
  string worker_engaged_at = 14;
  // The most workers the scheduler lets run now at the notch in effect, every agent counted (a watcher takes no
  // slot): the window's count of what a notch runs is this.
  int32 slots = 15;
  // The most workers each manual notch lets run now, as the scheduler weighs them.
  repeated LoadNotchSlots notch_slots = 16;
  // Workers among running_workers that the developer started or resumed by hand, whatever the slots (djinn task
  // start, djinn task resume): the ones that may run beyond slots.
  int32 forced_workers = 17;
  // Whether lowering the notch pauses the newest workers above what it lets run: not in auto mode, nor on Windows,
  // where they finish their run. Investigators, corrections, reviews and workers started by hand always finish theirs.
  bool lower_pauses = 18;
  // Why auto mode runs at its notch; unset outside auto mode.
  LoadAutoReason auto_reason = 19;
}

message LoadServiceSetRequest {
  // The notch to set.
  LoadNotch notch = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {defined_only: true, not_in: [0]}
  ];
}

message LoadServiceSetResponse {
  // The notch in effect.
  LoadNotch notch = 1;
  // Whether auto mode is active.
  bool auto = 2;
  // The chosen ceiling notch when auto mode is active.
  LoadNotch chosen_notch = 3;
}

message LoadServiceWatchRequest {}

message LoadServiceWatchResponse {
  // Operating load notch in effect.
  LoadNotch notch = 1;
  // Engaged memory: sum of peak forecasts (Policy.WorkerRoom) for running workers, in bytes.
  uint64 engaged_memory_bytes = 2;
  // Real measured resident memory of running workers, in bytes.
  uint64 worker_memory_bytes = 3;
  // Total RAM of the machine, in bytes.
  uint64 memory_total_bytes = 4;
  // Available RAM of the machine, in bytes.
  uint64 memory_available_bytes = 5;
  // Whether auto mode is active.
  bool auto = 6;
  // The base rule's slots on this machine before notch scaling.
  int32 base_slots = 7;
  // Number of workers currently running.
  int32 running_workers = 8;
  // The chosen ceiling notch when auto mode is active.
  LoadNotch chosen_notch = 9;
  // Forecast memory per worker in bytes: the median of the latest finished workers' memory at worker_percentile,
  // plus the notch's margin, or the policy default.
  uint64 worker_forecast_bytes = 10;
  // The binding resource: "memory" or "cpu".
  string binding_resource = 11;
  // Worker slots allowed by CPU before notch scaling.
  int32 cpu_slots = 12;
  // Worker slots allowed by memory before notch scaling.
  int32 memory_slots = 13;
  // Number of workers currently paused.
  int32 paused_workers = 14;
  // The percentile of its memory series a worker is engaged at under this notch (machine.Policy.Percentile).
  int32 worker_percentile = 15;
  // The same in words, like "engaged at p50 (overclock)".
  string worker_engaged_at = 16;
  // The most workers the scheduler lets run now at the notch in effect (LoadServiceGetResponse.slots).
  int32 slots = 17;
  // The most workers each manual notch lets run now, as the scheduler weighs them.
  repeated LoadNotchSlots notch_slots = 18;
  // Workers among running_workers started or resumed by hand, whatever the slots.
  int32 forced_workers = 19;
  // Whether lowering the notch pauses the newest workers above what it lets run (LoadServiceGetResponse.lower_pauses).
  bool lower_pauses = 20;
  // Why auto mode runs at its notch; unset outside auto mode.
  LoadAutoReason auto_reason = 21;
}

// LoadAutoStep is what auto mode does with its notch, from the load outside Djinn against its marks.
enum LoadAutoStep {
  // Not set.
  LOAD_AUTO_STEP_UNSPECIFIED = 0;
  // Between the marks, or nothing measured yet: auto keeps its notch.
  LOAD_AUTO_STEP_HOLD = 1;
  // Above the high mark: one notch down once that load stayed there 2 minutes.
  LOAD_AUTO_STEP_LOWER = 2;
  // Below the low marks: one notch up once that load stayed there 10 minutes.
  LOAD_AUTO_STEP_RAISE = 3;
  // Below the low marks at the chosen notch: auto runs up to it.
  LOAD_AUTO_STEP_CEILING = 4;
  // Above the high mark at Minimal: auto goes no lower.
  LOAD_AUTO_STEP_FLOOR = 5;
}

// LoadAutoReason says why auto mode runs at its notch: the load outside Djinn (the machine's CPU and memory beyond
// Djinn's own tree, as the Hourglass splits it), read every 20 seconds and averaged.
message LoadAutoReason {
  // The load outside Djinn, averaged over window_seconds, in percent of the machine: its CPU, or its memory when
  // memory is set.
  double outside_percent = 1;
  // Whether outside_percent is the memory, where it decides, rather than the CPU.
  bool memory = 2;
  // The span of the average, in seconds: 2 minutes against the high mark, up to 10 against the low ones; 0 when
  // nothing is measured yet.
  int32 window_seconds = 3;
  // What auto mode does next if the load stays where it is.
  LoadAutoStep step = 4;
  // The notch of that step: the next one when lowering or raising, the chosen one at the ceiling, the one in effect
  // otherwise.
  LoadNotch notch = 5;
  // Seconds before that step if the load stays where it is; 0 when holding.
  int32 in_seconds = 6;
}

// LoadNotchSlots is the most workers a notch lets run on the machine now.
message LoadNotchSlots {
  // The notch.
  LoadNotch notch = 1;
  // The most workers it lets run.
  int32 slots = 2;
}
