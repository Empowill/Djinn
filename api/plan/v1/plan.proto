// The processes an ifrit runs through Djinn, rather than in the background of its shell: a dev server, a stack. Djinn
// starts each in the ifrit's worktree, in a process group of its own, writes its output to a log, shows the ports it
// listens on as links, and stops it when the ifrit goes out, ends or stops; it starts them again when the ifrit is lit
// again. Only an ifrit runs one.
service ServeService {
  // Start a serve: the command returns once its process lives, and once each port it declares answers. A serve of the
  // same name is stopped first. Like a watcher's, its command must be allowed by the project or the wish's allowance.
  rpc Run(ServeServiceRunRequest) returns (ServeServiceRunResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // List an ifrit's serves: their ports, their state.
  rpc List(ServeServiceListRequest) returns (ServeServiceListResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Stop a serve: its stop command first, then its process group. It stays in the ifrit's serves, stopped, and does not
  // start again when the ifrit is lit again.
  rpc Stop(ServeServiceStopRequest) returns (ServeServiceStopResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Print the end of what a serve wrote, its output and its errors together.
  rpc Logs(ServeServiceLogsRequest) returns (ServeServiceLogsResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message ServeServiceRunRequest {
  // Its name, like front or back.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[A-Za-z][A-Za-z0-9_-]{0,39}$"
  ];
  // The command, run through the shell: quote it whole, like "npm run dev".
  string command = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 4096
  ];
  // The ifrit; by default $DJINN_TASK_ID, which Djinn sets for every worker.
  string task_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true,
    (djinn.v1.env) = "DJINN_TASK_ID"
  ];
  // The folder it runs in; by default the ifrit's worktree.
  string directory = 4 [(buf.validate.field).string.max_len = 4096];
  // A gate it holds for as long as it runs, like stack: others wait for it until the ifrit goes out or ends.
  string gate = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^[A-Za-z][A-Za-z0-9_-]{0,39}$"
  ];
  // A port it listens on, with its name: 8080=api. Repeat it for each. Djinn finds the ports its processes hold by
  // itself; declare one that Docker publishes, which none of them does.
  repeated string port = 6 [
    (buf.validate.field).repeated.max_items = 20,
    (buf.validate.field).repeated.items.string.pattern = "^[0-9]{1,5}(=[A-Za-z0-9_-]{1,40})?$"
  ];
  // The command that stops what lives outside its processes, like containers: run first when it stops, for a minute
  // at most.
  string stop = 7 [(buf.validate.field).string.max_len = 4096];
}

message ServeServiceRunResponse {
  // The serve, started.
  Serve serve = 1;
}

message ServeServiceListRequest {
  // The ifrit; by default $DJINN_TASK_ID, which Djinn sets for every worker.
  string task_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true,
    (djinn.v1.env) = "DJINN_TASK_ID"
  ];
}

message ServeServiceListResponse {
  // Its serves, in the order they were first started.
  repeated Serve serves = 1;
}

message ServeServiceStopRequest {
  // Its name.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[A-Za-z][A-Za-z0-9_-]{0,39}$"
  ];
  // The ifrit; by default $DJINN_TASK_ID, which Djinn sets for every worker.
  string task_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true,
    (djinn.v1.env) = "DJINN_TASK_ID"
  ];
}

message ServeServiceStopResponse {
  // The serve, stopped.
  Serve serve = 1;
}

message ServeServiceLogsRequest {
  // Its name.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[A-Za-z][A-Za-z0-9_-]{0,39}$"
  ];
  // The ifrit; by default $DJINN_TASK_ID, which Djinn sets for every worker.
  string task_id = 2 [
