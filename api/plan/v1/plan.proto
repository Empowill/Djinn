syntax = "proto3";

// The plan of work: the projects Djinn knows, the wishes it works to grant across them, their tasks, and the
// questions agents ask along the way.
package plan.v1;

import "buf/validate/validate.proto";
import "djinn/v1/options.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

// A project is a folder Djinn works in, a Git repository or not.
message Project {
  option (djinn.v1.unique) = {fields: ["name"]};
  option (djinn.v1.unique) = {fields: ["directory"]};

  // Identifier, a UUIDv7.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Short name, unique without regard to case.
  string name = 2;
  // Absolute path of the folder on this machine, symbolic links resolved. Empty for a project an imported wish
  // names but this machine does not have yet: djinn project add <folder> attaches it.
  string directory = 3;
  // Whether the folder is inside a Git repository.
  bool git = 4;
  // When the project was added.
  google.protobuf.Timestamp create_time = 5;
  // URL of the Git remote, origin or else the first one, without credentials; empty without one. Another
  // machine finds the project by it, case ignored.
  string remote = 6;
  // Skills of other projects this project summons: its workers get them at launch, nothing is copied.
  repeated Summon summons = 7;
}

// A skill a project summons from another project. It stays in its source, and the summoning project follows it:
// Djinn shows each worker the source's folder as it is, by its agent's own path, and writes nothing in the project.
message Summon {
  // The project that holds the skill.
  string project_id = 1;
  // The skill's folder name, in that project's .agents/skills or .claude/skills.
  string skill = 2;
  // When it was summoned.
  google.protobuf.Timestamp create_time = 3;
}

// A wish is what you ask Djinn for, and what it works to grant. It may span several projects.
message Wish {
  // Identifier, a UUIDv7.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // What is wished, in a sentence.
  string title = 2;
  // Projects the wish works on.
  repeated string project_ids = 3;
  // When the wish was made.
  google.protobuf.Timestamp create_time = 4;
  // Rights the developer allows the wish's workers, per project, ahead of any task.
  repeated ProjectAllowance allowances = 5;
  // The lead: the agent session that drives the wish, for djinn wish resume to take it back.
  Lead lead = 6;
  // Where the wish stands: active, paused or granted. Three wishes are active at most.
  WishState state = 7;
  // Place among the active wishes, from 1: the first one has priority. 0 for a paused or granted wish.
  int32 rank = 8;
  // When the user granted the wish.
  google.protobuf.Timestamp grant_time = 9;
  // Djinn proposes to grant the wish: it has tasks, all finished, no question is open, and no task waits for an
  // answer or failed. Computed on every read, never stored. Only the user grants a wish.
  bool ready = 10;
  // Kind of agent of the wish, chosen when it was made and changed by djinn wish set-provider: its lead runs it, and so
  // does every task that names no other. Not set on a wish made before the choice: Claude.
  Provider provider = 11;
  // The lead's terminal runs a program in this djinn up, which djinn wish tell writes to. Set by the list of the
  // wishes, never stored.
  bool lead_running = 12;
  // The choice the lead's agent shows in its terminal now, waiting for the developer: an approval (a command, an
  // edit, the network), a folder to trust. Read from its screen by the list of the wishes, never stored.
  LeadPrompt lead_prompt = 13;
  // The last lead terminal ended in this Djinn. Computed from the retained terminal, never stored.
  LeadExit lead_exit = 14;
  // A lead could not be started. Kept until the next successful start in this Djinn, never stored.
  string lead_error = 15;
}

// LeadExit records a terminal's exit, including success (code 0).
message LeadExit {
  int32 code = 1;
}

// LeadPrompt is a choice an agent shows in the lead's terminal, as read from its screen: the window shows it, and
// WishService.Choose picks an option there, as the keys would.
message LeadPrompt {
  // The question, as the agent asks it: "Do you want to proceed?". Empty when the screen shows none.
  string title = 1;
  // What it is about, a line each, as on screen: the command, the file, the reason.
  repeated string lines = 2;
  // The options, in order, without their number.
  repeated string options = 3;
}

// WishState is where a wish stands. A djinn grants three wishes at a time, never more: three are active at most.
enum WishState {
  // Not set: a wish made before Djinn recorded its state, taken as active.
  WISH_STATE_UNSPECIFIED = 0;
  // Djinn works on it, in the order of the ranks.
  WISH_STATE_ACTIVE = 1;
  // Set aside by the user: it keeps everything, and leaves its place to another wish.
  WISH_STATE_PAUSED = 2;
  // The user granted it: it is done.
  WISH_STATE_GRANTED = 3;
}

// The lead of a wish: an agent session the user talks to, in the lead's terminal. Never a secret: the provider and
// the session's identifier, which the agent's own command line resumes.
message Lead {
  // Kind of agent: claude or codex.
  Provider provider = 1;
  // Identifier of the session, as the agent names it: claude --resume takes it.
  string session_id = 2;
  // Folder the session runs in on this machine: an agent finds its sessions by folder. An export replaces it by
  // its project's name or ~, and an import puts this machine's folder back when it knows it.
  string directory = 3;
}

// Allowance is a right the developer allows a wish's workers in one of its projects, an explicit decision that
// applies to every task of the wish in that project, and to no other wish; and to its lead, when it starts there.
enum Allowance {
  // Not set.
  ALLOWANCE_UNSPECIFIED = 0;
  // No right allowed: the project's configuration decides. Removes an allowance.
  ALLOWANCE_NONE = 1;
  // The workers may edit the project's files.
  ALLOWANCE_EDIT = 2;
  // The workers may edit the project's files, in their agent's auto mode.
  ALLOWANCE_AUTO = 3;
}

// ProjectAllowance is the right a wish allows its workers in one project.
message ProjectAllowance {
  // The project.
  string project_id = 1;
  // The right.
  Allowance allowance = 2;
}

// TaskStatus is where a task stands.
enum TaskStatus {
  // Not set.
  TASK_STATUS_UNSPECIFIED = 0;
  // Planned, not started.
  TASK_STATUS_PENDING = 1;
  // A worker is on it.
  TASK_STATUS_RUNNING = 2;
  // Finished.
  TASK_STATUS_DONE = 3;
  // Stopped on an error.
  TASK_STATUS_FAILED = 4;
  // Stopped on request.
  TASK_STATUS_STOPPED = 5;
  // Cut short because djinn up stopped or crashed while its worker ran. The task keeps its provider, session and
  // worktree, to be resumed; nothing restarts it by itself.
  TASK_STATUS_INTERRUPTED = 6;
  // Its worker ended read-only, and the task waits for the developer's answer to its edit question
  // (Task.edit_question_id): a yes starts the worker again, allowed to edit the project's files.
  TASK_STATUS_WAITING = 7;
  // Its worker holds still on request, without losing anything, until it is resumed. It takes no slot of the
  // machine meanwhile.
  TASK_STATUS_PAUSED = 8;
}

// TaskAccess says where the rights of a task's worker come from (docs/providers.md, "What a worker may do").
enum TaskAccess {
  // Not set: a task spawned before Djinn recorded it.
  TASK_ACCESS_UNSPECIFIED = 0;
  // Outside any project: the worker only reads, in an empty folder of its own.
  TASK_ACCESS_READ_ONLY = 1;
  // The project's .agents/permissions.txtpb, translated for the agent.
  TASK_ACCESS_AGENTS = 2;
  // The agent's own configuration of the project: a Git repository, or a folder with agent configuration files.
  TASK_ACCESS_NATIVE = 3;
  // A folder outside Git without any agent configuration: the worker only reads until the developer answers the
  // task's edit question.
  TASK_ACCESS_ASKING = 4;
  // The developer answered yes: the worker may edit the project's files, and runs no command.
  TASK_ACCESS_EDIT_GRANTED = 5;
  // The developer answered no: the worker only reads.
  TASK_ACCESS_EDIT_REFUSED = 6;
  // The wish allows editing in the project (Wish.allowances): the worker may edit, on top of the project's
  // .agents/permissions.txtpb when it has one.
  TASK_ACCESS_WISH_EDIT = 7;
  // The wish allows the auto mode in the project: the worker may edit, in its agent's auto mode.
  TASK_ACCESS_WISH_AUTO = 8;
}

// Provider is the kind of agent a worker runs.
enum Provider {
  // Not set: Claude.
  PROVIDER_UNSPECIFIED = 0;
  // Claude Code, the claude command.
  PROVIDER_CLAUDE = 1;
  // A fake agent that plays a script, to try Djinn without a paid model: each line of the prompt is a step,
  // like "text Hello", "tool Bash ls", "result ok", "usage 1200 300 0.02", "write notes.md Hi" (when it may edit),
  // "sleep 5s", "fail why" or "exit 2";
  // any other line is said back as text.
  PROVIDER_FAKE = 2;
  // Codex, the codex command, driven through its app-server (JSON-RPC on stdio).
  PROVIDER_CODEX = 3;
  // Antigravity, Google's agy command, in headless stream-json mode.
  PROVIDER_ANTIGRAVITY = 4;
}

// Usage is what a worker spent, as its provider reports it.
message Usage {
  // Tokens read, cache aside.
  int64 input_tokens = 1;
  // Tokens written.
  int64 output_tokens = 2;
  // Tokens read from the prompt cache.
  int64 cache_read_tokens = 3;
  // Tokens written to the prompt cache.
  int64 cache_write_tokens = 4;
  // Cost in US dollars, as the provider computes it.
  double cost_usd = 5;
}

// A task is one item of a wish's flight plan, done in one project.
message Task {
  option (djinn.v1.unique) = {fields: ["wish_id", "code"]};

  // Identifier, a UUIDv7.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Wish the task belongs to.
  string wish_id = 2;
  // Project the task works in; empty for a task outside any project, which only reads.
  string project_id = 3;
  // Short code to dictate, like W2, unique within the wish.
  string code = 4;
  // What the task does.
  string title = 5;
  // Where the task stands.
  TaskStatus status = 6;
  // Kind of agent that works on the task.
  Provider provider = 7;
  // Root of the task's Git worktree, in Djinn's data folder; empty outside Git, where the worker runs in the
  // project folder.
  string worktree = 8;
  // Branch of the worktree.
  string branch = 9;
  // Session of the agent, to resume it.
  string session_id = 10;
  // What the worker spent so far, summed over its runs.
  Usage usage = 11;
  // Exit code of the worker's process, once it ended.
  int32 exit_code = 12;
  // Why the task failed or stopped.
  string error = 13;
  // When the task was created.
  google.protobuf.Timestamp create_time = 14;
  // When its worker started.
  google.protobuf.Timestamp start_time = 15;
  // When its worker ended.
  google.protobuf.Timestamp end_time = 16;
  // Where its worker's rights come from.
  TaskAccess access = 17;
  // The question asking the developer whether the worker may edit the project's files, for a task whose access
  // is, or was, ASKING.
  string edit_question_id = 18;
  // Model of the agent, as spawned; empty for the provider's default. A worker started again keeps it.
  string model = 19;
  // Most the task may spend, in US dollars, over all its runs; 0 for no cap.
  double max_budget_usd = 20;
  // Tasks that must be done before this one starts, by identifier. A task whose dependency ends without being done
  // fails too.
  repeated string depends_on = 21;
  // What the task writes, as paths in the project's folder ("src", "docs/api.md"); empty for the whole folder.
  // Outside Git, two tasks whose scopes overlap never run together. In Git, each task has its own worktree, and
  // scopes are not checked.
  repeated string write_scopes = 22;
  // Djinn starts the task's worker by itself, once its dependencies are done, its scopes free and a slot free:
  // the task was spawned or planned on this machine. A task imported with a wish is not.
  bool scheduled = 23;
  // Why a planned task has not started yet; empty once it has.
  string wait_reason = 24;
  // The session the worker started from, forked: a copy of another task's or of the lead's conversation, with a
  // new session of its own. Empty for a worker that starts from its prompt alone, the default. Stays on this
  // machine: an export leaves it out.
  string fork_session = 25;
  // Where the fork comes from, for a reader: the code of the task (W1), or "lead".
  string fork_of = 26;
  // The planned task waits for the machine alone: no slot is free, or the machine is under pressure. djinn task
  // start starts it anyway.
  bool machine_wait = 27;
}

// TaskEventKind says what a worker event is. Its content stays free text.
enum TaskEventKind {
  // Not set.
  TASK_EVENT_KIND_UNSPECIFIED = 0;
  // What Djinn asked the worker.
  TASK_EVENT_KIND_PROMPT = 1;
  // Text the agent wrote.
  TASK_EVENT_KIND_TEXT = 2;
  // A tool the agent called, and its input.
  TASK_EVENT_KIND_TOOL_CALL = 3;
  // What a tool returned.
  TASK_EVENT_KIND_TOOL_RESULT = 4;
  // What the worker spent so far.
  TASK_EVENT_KIND_USAGE = 5;
  // The worker started, ended or changed state.
  TASK_EVENT_KIND_STATUS = 6;
  // An error the agent or its process reported.
  TASK_EVENT_KIND_ERROR = 7;
  // A line the process wrote on its error output.
  TASK_EVENT_KIND_LOG = 8;
  // Anything else the provider sent, kept in raw.
  TASK_EVENT_KIND_OTHER = 9;
  // The task waits for a gate, takes it or gives it back (djinn gate run).
  TASK_EVENT_KIND_GATE = 10;
  // A message the lead or the user sent the worker while it works (djinn task send).
  TASK_EVENT_KIND_MESSAGE = 11;
  // The worker took a message in: it said something after the message reached it. Its text is the message's.
  TASK_EVENT_KIND_RECEIVED = 12;
}

// An event of a task's worker: what it said, the tools it called, what it spent.
message TaskEvent {
  option (djinn.v1.unique) = {fields: ["task_id", "seq"]};

  // Identifier, a UUIDv7.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Task of the worker.
  string task_id = 2;
  // Position in the task, from 1, with no gap.
  int64 seq = 3;
  // What the event is.
  TaskEventKind kind = 4;
  // The event for a reader: the text, the tool and its input, the error.
  string text = 5;
  // What the worker spent so far, on a usage event.
  Usage usage = 6;
  // The provider's line as it came, when the event comes from one.
  string raw = 7;
  // When the event arrived.
  google.protobuf.Timestamp create_time = 8;
}

// Choice is an answer to a question: YES for a question without options, or the letter of an option.
enum Choice {
  // No choice.
  CHOICE_UNSPECIFIED = 0;
  // Yes, for a question without options. On options that say yes and no, the one that says yes: the answer keeps its
  // letter.
  CHOICE_YES = 1;
  // No, on options that say yes and no: the one that says no. The answer keeps its letter.
  CHOICE_NO = 6;
  // The first option.
  CHOICE_A = 2;
  // The second option.
  CHOICE_B = 3;
  // The third option.
  CHOICE_C = 4;
  // The fourth option.
  CHOICE_D = 5;
}

// A question an agent asks the developer. Once answered, it is a decision.
message Question {
  option (djinn.v1.unique) = {fields: ["wish_id", "code"]};

  // Identifier, a UUIDv7.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Short code to dictate, like Q03, unique within the wish and never reused.
  string code = 2;
  // Wish the question belongs to.
  string wish_id = 3;
  // The question itself.
  string text = 4;
  // Options offered, answered by their letter: A for the first one, then B, C and D.
  repeated string options = 5;
  // When the question was asked.
  google.protobuf.Timestamp create_time = 6;
  // The answer; a question that has one is a decision.
  Answer answer = 7;
  // What is at stake, in Markdown: what the answer changes, what each option costs.
  string context = 8;
  // The option the asker recommends, and why, in Markdown. Starting with its letter (B: …) lets the developer
  // approve it in one click.
  string recommendation = 9;
  // What the developer marked on it from the window: read, approved.
  repeated Mark marks = 10;
  // Its rounds, oldest first: each request to investigate, each revision by the lead. The last one an open question
  // has is a request: it is being investigated, and waits for the lead, not for the developer.
  repeated Round rounds = 11;
  // How many times the lead revised it.
  int32 revision = 12;
}

// A round of a question before it is decided: a request to investigate, or the lead's revision.
message Round {
  // Which round.
  RoundKind kind = 1;
  // Who did it.
  string actor = 2;
  // When.
  google.protobuf.Timestamp create_time = 3;
  // For a request, what to dig into.
  string note = 4;
  // For a revision, what the question said before it.
  string context = 5;
  // For a revision, the options before it.
  repeated string options = 6;
  // For a revision, the recommendation before it.
  string recommendation = 7;
}

// What a round is.
enum RoundKind {
  // Not set.
  ROUND_KIND_UNSPECIFIED = 0;
  // The developer asked to investigate before deciding.
  ROUND_KIND_ENLIGHTEN = 1;
  // The lead revised the question after investigating.
  ROUND_KIND_REVISE = 2;
}

// A mark the developer puts on a question, a decision or a block: read, or approved as it is. The lead reads the marks
// in the wish's brief and with djinn mark list.
message Mark {
  // Which mark.
  MarkKind kind = 1;
  // Who put it.
  string actor = 2;
  // When it was put.
  google.protobuf.Timestamp create_time = 3;
}

// What a mark says.
enum MarkKind {
  // Not set.
  MARK_KIND_UNSPECIFIED = 0;
  // Read: the developer has seen it.
  MARK_KIND_READ = 1;
  // Approved as it is. On an open question, it answers with the option the recommendation names.
  MARK_KIND_APPROVED = 2;
}

// The answer to a question.
message Answer {
  // What was chosen.
  Choice choice = 1;
  // Free text that comes with the choice.
  string note = 2;
  // When the question was answered.
  google.protobuf.Timestamp create_time = 3;
}

// QuestionRef points to a question by its code or by its identifier.
message QuestionRef {
  oneof ref {
    option (buf.validate.oneof).required = true;
    // Short code, like Q03.
    string code = 1 [(buf.validate.field).string.pattern = "^Q[0-9]{2,3}$"];
    // Identifier, a UUID.
    string id = 2 [(buf.validate.field).string.uuid = true];
  }
}

// Questions agents ask, and the decisions taken.
service QuestionService {
  // Ask the developer a question. Offer up to four options to answer by letter, or none for a yes/no question.
  rpc Ask(QuestionServiceAskRequest) returns (QuestionServiceAskResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Answer a question, which turns it into a decision.
  rpc Answer(QuestionServiceAnswerRequest) returns (QuestionServiceAnswerResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // List questions, the most recent last.
  rpc List(QuestionServiceListRequest) returns (QuestionServiceListResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Ask to investigate an open question before deciding: it waits for the lead, who finds out more and revises it.
  rpc Enlighten(QuestionServiceEnlightenRequest) returns (QuestionServiceEnlightenResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Revise an open question after investigating: its context, options or recommendation. The former ones stay in its
  // rounds, and the question waits for the developer again.
  rpc Revise(QuestionServiceReviseRequest) returns (QuestionServiceReviseResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
}

message QuestionServiceEnlightenRequest {
  // The question: its code, like Q03, or its identifier.
  QuestionRef question = 1 [(buf.validate.field).required = true];
  // What to dig into before deciding.
  string note = 2 [(buf.validate.field).string.max_len = 2000];
  // Wish of the question, needed only when its code exists in several wishes.
  string wish_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message QuestionServiceEnlightenResponse {
  // The question, being investigated.
  Question question = 1;
}

message QuestionServiceReviseRequest {
  // The question: its code, like Q03, or its identifier.
  QuestionRef question = 1 [(buf.validate.field).required = true];
  // What is at stake now, in Markdown; the former context when empty.
  string context = 2 [(buf.validate.field).string.max_len = 20000];
  // The options now, up to four; the former ones when none.
  repeated string options = 3 [
    (buf.validate.field).repeated.max_items = 4,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
  // The option you recommend now, and why; the former recommendation when empty.
  string recommendation = 4 [(buf.validate.field).string.max_len = 20000];
  // Wish of the question, needed only when its code exists in several wishes.
  string wish_id = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message QuestionServiceReviseResponse {
  // The question, revised.
  Question question = 1;
}

message QuestionServiceAskRequest {
  // The question, in one or two sentences.
  string text = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 2000
  ];
  // An option the developer can pick; repeat for each one, up to four.
  repeated string options = 2 [
    (buf.validate.field).repeated.max_items = 4,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
  // Wish the question belongs to.
  string wish_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // What is at stake, in Markdown: what the answer changes, what each option costs.
  string context = 4 [(buf.validate.field).string.max_len = 20000];
  // The option you recommend, and why, in Markdown.
  string recommendation = 5 [(buf.validate.field).string.max_len = 20000];
}

message QuestionServiceAskResponse {
  // The question, with its code.
  Question question = 1;
}

message QuestionServiceAnswerRequest {
  // The question to answer: its code, like Q03, or its identifier.
  QuestionRef question = 1 [(buf.validate.field).required = true];
  // The choice: yes, or the letter of an option. On options that say yes and no, yes or no, in any language Djinn
  // speaks.
  Choice choice = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // Why this choice, or what to do with it.
  string note = 3 [(buf.validate.field).string.max_len = 2000];
  // Wish of the question, needed only when its code exists in several wishes.
  string wish_id = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message QuestionServiceAnswerResponse {
  // The question, now a decision.
  Question question = 1;
}

message QuestionServiceListRequest {
  // Only the questions still waiting for an answer.
  bool open = 1;
  // Only the questions asked at or after this time.
  google.protobuf.Timestamp since = 2;
  // Only the questions of this wish.
  string wish_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message QuestionServiceListResponse {
  // The questions.
  repeated Question questions = 1;
}

// Projects Djinn works in.
service ProjectService {
  // Add a folder as a project. It need not be a Git repository.
  rpc Add(ProjectServiceAddRequest) returns (ProjectServiceAddResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // List the projects.
  rpc List(ProjectServiceListRequest) returns (ProjectServiceListResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
}

message ProjectServiceAddRequest {
  // The folder of the project; a relative path starts from the current directory.
  string directory = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 4096
  ];
  // Short name, unique without regard to case; by default the name of the folder.
  string name = 2 [(buf.validate.field).string.max_len = 100];
}

message ProjectServiceAddResponse {
  // The project added.
  Project project = 1;
}

message ProjectServiceListRequest {}

message ProjectServiceListResponse {
  // The projects.
  repeated Project projects = 1;
}

// Skills: what a project's agents know how to do, one folder each in the Agent Skills format (a SKILL.md, maybe
// scripts and references), in .agents/skills or .claude/skills. A project summons a skill of another project to
// use it without copying it: it follows its source.
service SkillService {
  // Summon a skill of one project into another: djinn skill summon app/babysit-mr --into infra. Its workers get
  // it from their next launch on; nothing is written in either project.
  rpc Summon(SkillServiceSummonRequest) returns (SkillServiceSummonResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // List the skills of the projects: their own, and those they summon, with the ones whose source is missing.
  rpc List(SkillServiceListRequest) returns (SkillServiceListResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Unsummon a skill: the project's next workers no longer get it. The project stays as it was.
  rpc Unsummon(SkillServiceUnsummonRequest) returns (SkillServiceUnsummonResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
}

// A skill as a project sees it: its own, or summoned from another project.
message Skill {
  // The project that uses the skill.
  string project = 1;
  // Its name: its folder's name.
  string name = 2;
  // Where a summoned skill comes from, as <project>/<skill>; empty for the project's own.
  string source = 3;
  // Its folder on this machine, in the project that holds it.
  string directory = 4;
  // What it does, from its SKILL.md.
  string description = 5;
  // Why a summoned skill cannot be found; empty when it is.
  string missing = 6;
}

message SkillServiceSummonRequest {
  // The skill, as <project>/<skill>: the project that holds it, then its folder name. Case ignored.
  string skill = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 300,
    (buf.validate.field).string.pattern = "^[^/]+/[A-Za-z0-9][A-Za-z0-9._-]*$"
  ];
  // The project that summons it, by name or identifier.
  string into = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100
  ];
}

message SkillServiceSummonResponse {
  // The skill, as the project now sees it.
  Skill skill = 1;
}

message SkillServiceListRequest {
  // Only the skills of this project, by name or identifier.
  string project = 1 [(buf.validate.field).string.max_len = 100];
}

message SkillServiceListResponse {
  // The skills, by project then name.
  repeated Skill skills = 1;
}

message SkillServiceUnsummonRequest {
  // The skill, as <project>/<skill>, as it was summoned. Case ignored.
  string skill = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 300,
    (buf.validate.field).string.pattern = "^[^/]+/[A-Za-z0-9][A-Za-z0-9._-]*$"
  ];
  // The project that summoned it, by name or identifier.
  string from = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100
  ];
}

message SkillServiceUnsummonResponse {
  // The project, without the skill.
  Project project = 1;
}

// Wishes: what you ask Djinn for, across projects.
service WishService {
  // Make a wish.
  rpc Make(WishServiceMakeRequest) returns (WishServiceMakeResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // List the wishes: the active ones by rank, the first has priority; then the paused ones and the granted ones,
  // the most recent last.
  rpc List(WishServiceListRequest) returns (WishServiceListResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Export a wish to a file, to open it on another machine: its plan, questions, decisions, blocks and journal.
  // Never code, which travels through Git, never a secret, never a local path: projects are named by their name
  // and remote.
  rpc Export(WishServiceExportRequest) returns (WishServiceExportResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Import a wish from a file written by export. Each project is found on this machine by its remote, then by
  // its name; one not found is added without a folder, for djinn project add <folder> to attach.
  rpc Import(WishServiceImportRequest) returns (WishServiceImportResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Import a wish from the content of a file, as the window reads it. The journal records every import this
  // way, with the content, whatever way it came.
  rpc ImportData(WishServiceImportDataRequest) returns (WishServiceImportDataResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
  }
  // Record the lead of a wish: the agent session that drives it, for djinn wish resume to take it back. Starts
  // djinn if it is not running.
  rpc SetLead(WishServiceSetLeadRequest) returns (WishServiceSetLeadResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.autostart) = true;
  }
  // Take a wish back where it stopped: show it in the window, and resume its lead in the lead's terminal, or attach
  // to it if it runs. Without a lead session, a new lead starts in the wish's first project from the wish's brief
  // (djinn wish brief), and claude's session is recorded as the wish's lead. Starts djinn if it is not running.
  rpc Resume(WishServiceResumeRequest) returns (WishServiceResumeResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.autostart) = true;
  }
  // Change the wish's agent: its lead from now on, and every task to come that names no other; the tasks that run go
  // on with theirs. The lead that runs is stopped, and a new one starts with the new agent from the wish's brief (djinn
  // wish brief): its plan, questions and decisions. The old lead's conversation does not pass to the new agent.
  rpc SetProvider(WishServiceSetProviderRequest) returns (WishServiceSetProviderResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // The brief of a wish: a short text to start an agent on it, written by Djinn from the store, no model. First
  // what rarely changes (Djinn's rules, the rules of its projects), then where the wish stands (questions,
  // decisions, tasks running and waiting, the latest blocks), so an agent reads the first part from its cache.
  // No local path, no secret.
  rpc Brief(WishServiceBriefRequest) returns (WishServiceBriefResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Write to the wish's lead in its terminal, as if you typed it there, then Enter. The text waits while something
  // is being typed there or a choice is on screen, then goes; texts arrive in the order written. The lead must run:
  // djinn wish resume starts it. A terminal of its name that runs another program, a shell, gets nothing.
  rpc Tell(WishServiceTellRequest) returns (WishServiceTellResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Pick an option of the choice the lead's agent shows in its terminal (Wish.lead_prompt), as its keys would: the
  // window's answer to an approval. Refused when the screen shows another choice, or none. The window's only: an
  // agent never answers its own approval.
  rpc Choose(WishServiceChooseRequest) returns (WishServiceChooseResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
  }
  // Everything a wish holds, as an export carries it, and its projects on this machine, for the window.
  rpc Snapshot(WishServiceSnapshotRequest) returns (WishServiceSnapshotResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
  }
  // Allow the wish's workers a right in one of its projects, for every task to come: edit, or auto (edit in their
  // agent's auto mode); none takes it back. It weighs over the project's configuration, for this wish only. The lead
  // starting in that project gets the same mode, at its next start.
  rpc Allow(WishServiceAllowRequest) returns (WishServiceAllowResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Grant a wish: you say it is done. Djinn never grants a wish itself; it proposes it once the wish is ready (every
  // task finished, no question open), and you may grant it before.
  rpc Grant(WishServiceGrantRequest) returns (WishServiceGrantResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Pause a wish: it keeps everything, and leaves its place among the three active wishes to another one.
  rpc Pause(WishServicePauseRequest) returns (WishServicePauseResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Make a paused or granted wish active again, last by rank. Three wishes are active at most: pause or grant one
  // first.
  rpc Activate(WishServiceActivateRequest) returns (WishServiceActivateResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Move an active wish to another rank: --to 1 gives it priority over the others.
  rpc Move(WishServiceMoveRequest) returns (WishServiceMoveResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Render the wish's page to a file: one HTML page standing alone, with its open questions first, then what waits
  // for you, its tasks, its decisions, its blocks and its journal. Djinn writes it, no model does. No secret, no
  // local path.
  rpc Render(WishServiceRenderRequest) returns (WishServiceRenderResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Render the wish's page in Djinn's data folder, print where, and keep it up to date while djinn up runs: every
  // change of the wish renders it again, at most once a second. Publishing it stays yours: share the file, or
  // republish it where you put it last time. Delete the file to stop.
  rpc Sync(WishServiceSyncRequest) returns (WishServiceSyncResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Follow what changes, as it changes: which wish, and what in it. It says what to read again, never the data
  // itself: the first message names everything, then each change follows; changes close together come as one. A
  // task's events come from TaskService.Watch.
  rpc Watch(WishServiceWatchRequest) returns (stream WishServiceWatchResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
}

message WishServiceWatchRequest {
  // Only the changes of this wish; by default, those of every wish. Projects come either way.
  string wish_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message WishServiceWatchResponse {
  // The wish that changed; empty for a change of no single wish: the projects, or everything at first.
  string wish_id = 1;
  // What changed, to read again.
  repeated Change changes = 2;
}

// Change is a kind of entity that changed, for a reader to read it again.
enum Change {
  // Not set.
  CHANGE_UNSPECIFIED = 0;
  // The wish itself: its title, state, rank, rights, lead, or whether Djinn proposes to grant it. A change of its
  // tasks or questions comes with it, as they decide that.
  CHANGE_WISH = 1;
  // Its tasks: one added, or one that changed state or spent.
  CHANGE_TASK = 2;
  // Its questions: one asked or answered.
  CHANGE_QUESTION = 3;
  // Its blocks: one put or deleted.
  CHANGE_BLOCK = 4;
  // The projects: one added or changed.
  CHANGE_PROJECT = 5;
}

message WishServiceRenderRequest {
  // The wish.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // File to write; a relative path starts from the current directory. By default, the wish's title with .html in
  // the Downloads folder.
  string file = 2 [(buf.validate.field).string.max_len = 4096];
}

message WishServiceRenderResponse {
  // The file written.
  string file = 1;
  // Its size, in bytes.
  int64 size = 2;
}

message WishServiceSyncRequest {
  // The wish.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message WishServiceSyncResponse {
  // The page, kept up to date: always the same file for a wish.
  string file = 1;
}

message WishServiceAllowRequest {
  // The wish.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // The project; by default the wish's project, when it has only one.
  string project_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // The right: edit, auto, or none to take it back.
  Allowance mode = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message WishServiceAllowResponse {
  // The wish, with its allowances.
  Wish wish = 1;
}

message WishServiceGrantRequest {
  // Numbers 2 and 3 carried the project and the right when this method gave rights, now Allow.
  reserved 2, 3;
  reserved "project_id", "mode";

  // The wish.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message WishServiceGrantResponse {
  // The wish, granted.
  Wish wish = 1;
}

message WishServicePauseRequest {
  // The wish.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message WishServicePauseResponse {
  // The wish, paused.
  Wish wish = 1;
}

message WishServiceActivateRequest {
  // The wish.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message WishServiceActivateResponse {
  // The wish, active.
  Wish wish = 1;
}

message WishServiceMoveRequest {
  // The wish, active.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // Its new rank, from 1 for the first; beyond the last, it goes last.
  int32 to = 2 [(buf.validate.field).int32.gte = 1];
}

message WishServiceMoveResponse {
  // The active wishes, by rank.
  repeated Wish wishes = 1;
}

message WishServiceMakeRequest {
  // What you wish, in a sentence.
  string title = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 500
  ];
  // A project the wish works on; repeat for each one.
  repeated string project_ids = 2 [(buf.validate.field).repeated.items.string.uuid = true];
  // Make it paused: it waits, out of the three active wishes.
  bool paused = 3;
  // Kind of agent for the wish's lead and, unless a task names another, its tasks: claude (the default), codex or
  // antigravity.
  Provider provider = 4 [(buf.validate.field).enum.defined_only = true];
  // What its agent may do in each of its projects from the start, as djinn wish allow gives it: edit, or auto. None,
  // or not set, leaves it to each project's configuration.
  Allowance allowance = 5 [(buf.validate.field).enum.defined_only = true];
}

message WishServiceMakeResponse {
  // The wish made.
  Wish wish = 1;
}

message WishServiceListRequest {}

message WishServiceListResponse {
  // The wishes.
  repeated Wish wishes = 1;
}

message WishServiceExportRequest {
  // The wish to export.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // File to write; a relative path starts from the current directory. A name ending in .json is written as JSON,
  // any other as binary protobuf. By default, the wish's title with .djinn in the Downloads folder.
  string file = 2 [(buf.validate.field).string.max_len = 4096];
}

message WishServiceExportResponse {
  // The file written.
  string file = 1;
  // Its size, in bytes.
  int64 size = 2;
}

message WishServiceImportRequest {
  // The file to import, binary protobuf or JSON; a relative path starts from the current directory.
  string file = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 4096
  ];
  // Replace the wish if it is already here, with everything it holds. Without it, a wish already here is refused.
  bool replace = 2;
}

message WishServiceImportResponse {
  // The wish imported.
  Wish wish = 1;
  // How each of its projects was found on this machine.
  repeated ProjectMatch projects = 2;
  // What to know, when there is something: an active wish imported paused, three being active here.
  string note = 3;
}

message WishServiceImportDataRequest {
  // The content of an export, binary protobuf or JSON.
  bytes data = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).bytes.max_len = 104857600
  ];
  // Replace the wish if it is already here, with everything it holds.
  bool replace = 2;
}

message WishServiceImportDataResponse {
  // The wish imported.
  Wish wish = 1;
  // How each of its projects was found on this machine.
  repeated ProjectMatch projects = 2;
  // What to know, when there is something: an active wish imported paused, three being active here.
  string note = 3;
}

message WishServiceSetLeadRequest {
  // The wish.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // Identifier of the lead's session, as the agent names it.
  string session_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
  ];
  // Kind of agent: claude or codex; by default the wish's, else claude.
  Provider provider = 3;
  // Folder the session runs in. By default, the folder of the wish's first project.
  string directory = 4 [(buf.validate.field).string.max_len = 4096];
}

message WishServiceSetLeadResponse {
  // The wish, with its lead.
  Wish wish = 1;
}

message WishServiceResumeRequest {
  // The wish.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // Kind of agent for a new lead, when the wish has none to resume: claude, codex or antigravity; by default the
  // wish's, else claude.
  Provider provider = 2 [(buf.validate.field).enum.defined_only = true];
}

message WishServiceResumeResponse {
  // The wish.
  Wish wish = 1;
  // Name of the lead's terminal in the window.
  string terminal = 2;
  // The command line the terminal runs, program first.
  repeated string command = 3;
  // Its working directory.
  string directory = 4;
  // The lead was already running: the window attached to it, nothing was started.
  bool attached = 5;
  // What to know, when there is something: no session to resume, a terminal that runs something else.
  string note = 6;
}

message WishServiceSetProviderRequest {
  // The wish.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // The new kind of agent: claude, codex or antigravity.
  Provider provider = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      in: [1, 3, 4]
    }
  ];
}

message WishServiceSetProviderResponse {
  // The wish, with its new agent.
  Wish wish = 1;
  // Name of the lead's terminal in the window; empty when this server runs no terminal.
  string terminal = 2;
  // The command line the new lead runs, program first; empty when none started.
  repeated string command = 3;
  // What to know: the conversation not carried over, the old lead's session, how to start the new lead.
  string note = 4;
}

message WishServiceBriefRequest {
  // The wish.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message WishServiceBriefResponse {
  // The brief, in Markdown: the stable part, then the part that moves.
  string text = 1;
}

message WishServiceTellRequest {
  // The wish.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // What to say to the lead. Line breaks stay line breaks for an agent that takes a paste.
  string text = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 20000
  ];
}

message WishServiceTellResponse {
  // The text waits in the lead's terminal: something is being typed there, or a choice is on screen. It goes once
  // they are done.
  bool waiting = 1;
  // Why it waits, when it does.
  TellWait wait = 2;
}

// Why a text told to a lead waits in its terminal before it is typed.
enum TellWait {
  // It does not wait.
  TELL_WAIT_UNSPECIFIED = 0;
  // A line is under way at the lead's prompt: the text goes once it is sent or cleared, or after a while without a
  // key.
  TELL_WAIT_TYPING = 1;
  // The lead shows a choice that keys answer: the text goes once it is answered in the terminal.
  TELL_WAIT_CHOICE = 2;
}

message WishServiceChooseRequest {
  // The wish.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // The option picked, from 1.
  int32 option = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 20
  }];
  // The choice as the window showed it, title and options: the screen must still show that one.
  string title = 3 [(buf.validate.field).string.max_len = 2000];
  repeated string options = 4 [(buf.validate.field).repeated.max_items = 20];
  // The command, file or reason shown: identical options alone do not identify an approval.
  repeated string lines = 5 [(buf.validate.field).repeated.max_items = 200];
}

message WishServiceChooseResponse {}

message WishServiceSnapshotRequest {
  // The wish.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message WishServiceSnapshotResponse {
  // Everything the wish holds. Its project references carry the identifiers of this machine.
  WishExport export = 1;
  // The wish's projects on this machine, with their folders.
  repeated Project projects = 2;
}

// ProjectMatchKind says how an imported project was found on this machine.
enum ProjectMatchKind {
  // Not set.
  PROJECT_MATCH_KIND_UNSPECIFIED = 0;
  // A project here has the same remote.
  PROJECT_MATCH_KIND_REMOTE = 1;
  // A project here has the same name, case ignored.
  PROJECT_MATCH_KIND_NAME = 2;
  // None: the project was added without a folder, to attach with djinn project add <folder>.
  PROJECT_MATCH_KIND_NEW = 3;
}

// ProjectMatch is how one project of an imported wish was found on this machine.
message ProjectMatch {
  // The project on this machine.
  Project project = 1;
  // How it was found.
  ProjectMatchKind match = 2;
  // What to check or do, when there is something.
  string note = 3;
}

// WishExport is a wish carried whole to another machine: its plan, questions, decisions, blocks and the commands
// of its journal. It holds no code, no secret and no local path: projects are named by their name and remote, and
// what only makes sense on the machine that ran a worker (its worktree, its agent session) is left out.
message WishExport {
  // Version of the format. This one is 1; an import refuses a version it does not know.
  int32 version = 1;
  // When the export was written.
  google.protobuf.Timestamp create_time = 2;
  // The wish. Its project_ids refer to the projects below.
  Wish wish = 3;
  // The projects the wish and its tasks work in.
  repeated ProjectRef projects = 4;
  // The tasks of the wish: the items of its plan and its workers.
  repeated Task tasks = 5;
  // What the workers said and did, task by task.
  repeated TaskEvent events = 6;
  // The questions asked; the answered ones are the decisions.
  repeated Question questions = 7;
  // The free content of the wish.
  repeated Block blocks = 8;
  // The commands of the journal that changed the wish, oldest first.
  repeated Command commands = 9;
}

// ProjectRef names a project without its folder, so that another machine finds its own copy.
message ProjectRef {
  // Identifier of the project where the export was written; only links the wish and its tasks to this reference.
  string id = 1;
  // Name of the project, compared without regard to case.
  string name = 2;
  // URL of the Git remote, without credentials.
  string remote = 3;
  // Whether the project is a Git repository.
  bool git = 4;
}

// Command is an entry of the journal: a request received, as is.
message Command {
  // Identifier, a UUIDv7.
  string id = 1;
  // Who sent it.
  string actor = 2;
  // When it was received.
  google.protobuf.Timestamp at = 3;
  // The method called, as a Connect procedure: /plan.v1.QuestionService/Ask.
  string method = 4;
  // The request.
  google.protobuf.Any request = 5;
}

// A block is free content of a wish, laid out by the lead: a decision taken outside a question, a section of
// analysis, a line of the journal, a diagram. Djinn computes nothing from it, and shows a kind it does not know as
// text: nothing is lost.
message Block {
  // Identifier, a UUIDv7.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Wish the block belongs to.
  string wish_id = 2;
  // Task the block is about, if any.
  string task_id = 3;
  // What the block is, in a word the lead chooses: decision, section, log, diagram, report…
  string kind = 4;
  // Title, in a line.
  string title = 5;
  // Order within the wish, lowest first. New blocks go 1000 after the last one, so that a block slips between
  // two others without moving them.
  int64 position = 6;
  // Media type of the content: text/markdown when empty, or another, like application/json.
  string media_type = 7;
  // The content.
  string content = 8;
  // When the block was created.
  google.protobuf.Timestamp create_time = 9;
  // When it last changed.
  google.protobuf.Timestamp update_time = 10;
  // What the developer marked on it from the window: read, approved.
  repeated Mark marks = 11;
}

// Blocks: the free content of a wish, beside its tasks and questions.
service BlockService {
  // Add a block to a wish, or change one: given its id, the fields set replace those of the block.
  rpc Put(BlockServicePutRequest) returns (BlockServicePutResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // List the blocks of a wish, in order.
  rpc List(BlockServiceListRequest) returns (BlockServiceListResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Delete a block.
  rpc Delete(BlockServiceDeleteRequest) returns (BlockServiceDeleteResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
}

message BlockServicePutRequest {
  // Wish the block belongs to.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // The block to change; a new block when empty.
  string id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // What the block is, in a word: decision, section, log, diagram, report…
  string kind = 3 [(buf.validate.field).string.max_len = 100];
  // Title, in a line.
  string title = 4 [(buf.validate.field).string.max_len = 1000];
  // The content, Markdown unless --media-type says otherwise.
  string content = 5 [(buf.validate.field).string.max_len = 1000000];
  // Media type of the content, like application/json; text/markdown by default.
  string media_type = 6 [(buf.validate.field).string.max_len = 200];
  // Task the block is about.
  string task_id = 7 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // Order within the wish; by default 1000 after the last block, for a new one.
  int64 position = 8;
}

message BlockServicePutResponse {
  // The block.
  Block block = 1;
}

message BlockServiceListRequest {
  // The wish.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // Only the blocks of this kind, case ignored.
  string kind = 2 [(buf.validate.field).string.max_len = 100];
  // Only the blocks about this task.
  string task_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message BlockServiceListResponse {
  // The blocks, by position.
  repeated Block blocks = 1;
}

message BlockServiceDeleteRequest {
  // The block.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message BlockServiceDeleteResponse {}

// Marks: what the developer read or approved from the window, on questions, decisions and blocks, so that the lead
// acts on a click without a word.
service MarkService {
  // Mark a question, a decision or a block: read, or approved as it is. Approving an open question answers it with
  // the option its recommendation names, as djinn question answer does.
  rpc Put(MarkServicePutRequest) returns (MarkServicePutResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // List the marks of a wish, the latest last.
  rpc List(MarkServiceListRequest) returns (MarkServiceListResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
}

// MarkTarget points to what a mark is on: a question by its code, or a question or a block by its identifier.
message MarkTarget {
  oneof ref {
    option (buf.validate.oneof).required = true;
    // A question's code, like Q03.
    string code = 1 [(buf.validate.field).string.pattern = "^Q[0-9]{2,3}$"];
    // The identifier of a question or of a block.
    string id = 2 [(buf.validate.field).string.uuid = true];
  }
}

// Marked is a mark with what it is on.
message Marked {
  // Wish of the question or block.
  string wish_id = 1;
  // The question marked, if it is one.
  string question_id = 2;
  // The block marked, if it is one.
  string block_id = 3;
  // The question's code, or the block's kind.
  string label = 4;
  // The question's text, or the block's title, in a line.
  string title = 5;
  // The mark.
  Mark mark = 6;
}

message MarkServicePutRequest {
  // What to mark: a question's code, like Q03, or the identifier of a question or of a block.
  MarkTarget target = 1 [(buf.validate.field).required = true];
  // The mark: read, or approved.
  MarkKind kind = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // Wish of the question, needed only when its code exists in several wishes.
  string wish_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // Take the mark off instead. An answer stays.
  bool remove = 4;
}

message MarkServicePutResponse {
  // The mark, and what it is on.
  Marked marked = 1;
}

message MarkServiceListRequest {
  // The wish.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message MarkServiceListResponse {
  // The marks, the latest last.
  repeated Marked marks = 1;
}

// Tasks: one worker each, an agent process in the task's own worktree.
service TaskService {
  // Start a worker on a new task: in a Git project, in a new worktree on its own branch. A task that cannot start
  // yet (a dependency not done, its write scope taken, no slot free, the machine under pressure) waits, and says
  // why; djinn up starts it as soon as it can.
  rpc Spawn(TaskServiceSpawnRequest) returns (TaskServiceSpawnResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // List the tasks, the oldest first.
  rpc List(TaskServiceListRequest) returns (TaskServiceListResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Show a task.
  rpc Get(TaskServiceGetRequest) returns (TaskServiceGetResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Stop a task's worker: asked to stop, then killed if it has not after a few seconds. A planned task that has not
  // started is stopped at once.
  rpc Stop(TaskServiceStopRequest) returns (TaskServiceStopResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Pause a running worker without killing it: it holds still, keeps what it did, and frees its slot of the machine
  // until it is resumed. Not possible on Windows yet.
  rpc Pause(TaskServicePauseRequest) returns (TaskServicePauseResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Let a paused worker go on where it was.
  rpc Resume(TaskServiceResumeRequest) returns (TaskServiceResumeResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Start a planned task that waits for the machine (no slot free, or the machine under pressure) now, anyway. A
  // task that waits for anything else (its wish, a dependency, a write scope) keeps waiting.
  rpc Start(TaskServiceStartRequest) returns (TaskServiceStartResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Follow a task's events as they come, from the first one or after a position; ends with the task.
  rpc Watch(TaskServiceWatchRequest) returns (stream TaskServiceWatchResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Remove the worktree of a finished task. Its branch stays.
  rpc Clean(TaskServiceCleanRequest) returns (TaskServiceCleanResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Delete a task no worker of this Djinn ran (a plan item, a task imported from another Djinn): it goes with its
  // events. A task a worker of this Djinn ran stays, as the record of that work.
  rpc Delete(TaskServiceDeleteRequest) returns (TaskServiceDeleteResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Send a message to a running worker: an instruction added while it works. The message is an event of the task,
  // and a "received" event follows once the worker says something after it.
  rpc Send(TaskServiceSendRequest) returns (TaskServiceSendResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
}

message TaskServiceSpawnRequest {
  // Wish the task belongs to.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // What the task does, in a sentence.
  string title = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 500
  ];
  // Project to work in; by default the wish's project, when it has only one. For a wish without any project, the
  // task runs outside any project: read-only, in an empty folder of its own.
  string project_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // What to ask the worker; by default the title.
  string prompt = 4 [(buf.validate.field).string.max_len = 200000];
  // Kind of agent; by default the wish's, else claude.
  Provider provider = 5 [(buf.validate.field).enum.defined_only = true];
  // Model of the agent; by default the provider's.
  string model = 6 [(buf.validate.field).string.max_len = 200];
  // Most the worker may spend, in US dollars, when the provider can enforce it.
  double max_budget_usd = 7 [(buf.validate.field).double.gte = 0];
  // A task of the same wish that must be done first: its code (W1) or its identifier.
  repeated string depends_on = 8 [
    (buf.validate.field).repeated.max_items = 100,
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.max_len = 64
  ];
  // A path the task writes, in the project's folder; none for the whole folder. Outside Git, tasks whose scopes
  // overlap never run together.
  repeated string write_scopes = 9 [
    (buf.validate.field).repeated.max_items = 100,
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.max_len = 1000
  ];
  // Only plan the task: the call returns at once, and djinn up starts the worker when the task is ready.
  bool later = 10;
  // Start the worker from a copy of this task's conversation (its code, W1, or its identifier), with a session of
  // its own, instead of from the prompt alone. The inherited context is read again at every turn: prefer a short
  // prompt, the default. Claude and Codex fork; Antigravity cannot.
  string fork = 11 [(buf.validate.field).string.max_len = 64];
  // Start the worker from a copy of the lead's conversation, as --fork does from a task.
  bool from_lead = 12;
}

message TaskServiceSpawnResponse {
  // The task: running, or waiting with its reason.
  Task task = 1;
}

message TaskServiceListRequest {
  // Only the tasks of this wish.
  string wish_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // Only the tasks in this project.
  string project_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message TaskServiceListResponse {
  // The tasks.
  repeated Task tasks = 1;
}

message TaskServiceGetRequest {
  // The task.
  string task_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message TaskServiceGetResponse {
  // The task.
  Task task = 1;
}

message TaskServiceStopRequest {
  // The task.
  string task_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message TaskServiceStopResponse {
  // The task, stopped.
  Task task = 1;
}

message TaskServiceSendRequest {
  // The task, running.
  string task_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // The message, as the worker reads it.
  string text = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 20000
  ];
}

message TaskServiceSendResponse {
  // The message, as an event of the task.
  TaskEvent event = 1;
}

message TaskServicePauseRequest {
  // The task.
  string task_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message TaskServicePauseResponse {
  // The task, paused.
  Task task = 1;
}

message TaskServiceResumeRequest {
  // The task.
  string task_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message TaskServiceResumeResponse {
  // The task, running again.
  Task task = 1;
}

message TaskServiceStartRequest {
  // The task.
  string task_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message TaskServiceStartResponse {
  // The task, its worker started.
  Task task = 1;
}

message TaskServiceWatchRequest {
  // The task.
  string task_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // Only the events after this position, to resume where a reader left off.
  int64 after_seq = 2 [(buf.validate.field).int64.gte = 0];
  // Also send each event's raw line from the provider.
  bool raw = 3;
}

message TaskServiceWatchResponse {
  // The next event.
  TaskEvent event = 1;
}

message TaskServiceCleanRequest {
  // The task.
  string task_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // Remove the worktree even when it holds changes not committed.
  bool force = 2;
}

message TaskServiceCleanResponse {
  // The task, without its worktree.
  Task task = 1;
}

message TaskServiceDeleteRequest {
  // The task.
  string task_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message TaskServiceDeleteResponse {
  // The task, as it was.
  Task task = 1;
}
