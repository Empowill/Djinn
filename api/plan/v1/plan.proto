message WishServiceBriefRequest {
  // The wish.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message WishServiceBriefResponse {
  // The brief, in Markdown: the stable part, then the part that moves.
  string text = 1;
}

message WishServiceSnapshotRequest {
  // The wish.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message WishServiceSnapshotResponse {
  // Everything the wish holds. Its project references carry the identifiers of this machine.
  WishExport export = 1;
  // The wish's projects on this machine, with their folders.
  repeated Project projects = 2;
}

// ProjectMatchKind says how an imported project was found on this machine.
enum ProjectMatchKind {
  // Not set.
  PROJECT_MATCH_KIND_UNSPECIFIED = 0;
  // A project here has the same remote.
  PROJECT_MATCH_KIND_REMOTE = 1;
  // A project here has the same name, case ignored.
  PROJECT_MATCH_KIND_NAME = 2;
  // None: the project was added without a folder, to attach with djinn project add <folder>.
  PROJECT_MATCH_KIND_NEW = 3;
}

// ProjectMatch is how one project of an imported wish was found on this machine.
message ProjectMatch {
  // The project on this machine.
  Project project = 1;
  // How it was found.
  ProjectMatchKind match = 2;
  // What to check or do, when there is something.
  string note = 3;
}

// WishExport is a wish carried whole to another machine: its plan, questions, decisions, blocks and the commands
// of its journal. It holds no code, no secret and no local path: projects are named by their name and remote, and
// what only makes sense on the machine that ran a worker (its worktree, its agent session) is left out.
message WishExport {
  // Version of the format. This one is 1; an import refuses a version it does not know.
  int32 version = 1;
  // When the export was written.
  google.protobuf.Timestamp create_time = 2;
  // The wish. Its project_ids refer to the projects below.
  Wish wish = 3;
  // The projects the wish and its tasks work in.
  repeated ProjectRef projects = 4;
  // The tasks of the wish: the items of its plan and its workers.
  repeated Task tasks = 5;
  // What the workers said and did, task by task.
  repeated TaskEvent events = 6;
  // The questions asked; the answered ones are the decisions.
  repeated Question questions = 7;
  // The free content of the wish.
  repeated Block blocks = 8;
  // The commands of the journal that changed the wish, oldest first.
  repeated Command commands = 9;
  // The tilasms of the wish. An export to a file carries the files of every version; a snapshot, only the manifests.
  repeated TilasmExport tilasms = 10;
}

// ProjectRef names a project without its folder, so that another machine finds its own copy.
message ProjectRef {
  // Identifier of the project where the export was written; only links the wish and its tasks to this reference.
  string id = 1;
  // Name of the project, compared without regard to case.
  string name = 2;
  // URL of the Git remote, without credentials.
  string remote = 3;
  // Whether the project is a Git repository.
  bool git = 4;
}

// Command is an entry of the journal: a request received, as is.
message Command {
  // Identifier, a UUIDv7.
  string id = 1;
  // Who sent it.
  string actor = 2;
  // When it was received.
  google.protobuf.Timestamp at = 3;
  // The method called, as a Connect procedure: /plan.v1.QuestionService/Ask.
  string method = 4;
  // The request.
  google.protobuf.Any request = 5;
}

// LeadService drives the lead of Djinn: a single agent session the user talks to, in the lead's terminal.
service LeadService {
  // Record the lead of Djinn: the agent session that drives it, for djinn lead resume to take it back. Starts
  // djinn if it is not running.
  rpc Set(LeadServiceSetRequest) returns (LeadServiceSetResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
    option (djinn.v1.autostart) = true;
  }
  // Take the lead back where it stopped: resume its session in the lead's terminal, or attach to it if it runs.
  // Without a lead session, a new lead starts from the brief (djinn brief) in the first of Djinn's projects, and
  // claude's session is recorded as the lead. A provider other than the recorded lead's starts a new lead of that
  // agent from the brief the same way: a claude one becomes the lead, a codex one once djinn lead set gives its
  // session, and an antigravity one leaves the record as it is. While the lead's terminal runs a program, nothing
  // starts, and the note says so. A lead never starts in the home folder: a session recorded there starts a new lead
  // the same way, and with no project nothing starts, the error says to create one. While Djinn drives the lead, no
  // terminal opens: the events that wait after a failed batch go to a new session at once, and the note says how the
  // lead runs. Starts djinn if it is not running.
  rpc Resume(LeadServiceResumeRequest) returns (LeadServiceResumeResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
    option (djinn.v1.autostart) = true;
  }
  // The lead of Djinn, as currently recorded.
  rpc Get(LeadServiceGetRequest) returns (LeadServiceGetResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The brief for the lead: every active wish at once, rules once, paused and granted wishes in one line; at its end,
  // a line per active wish again, for an agent whose tool keeps only the end of a long output. With --wishes, where
  // the wishes stand only.
  rpc Brief(LeadServiceBriefRequest) returns (LeadServiceBriefResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The lead's notes: how to lead, learnt from past wishes, one note per file of lead/notes in Djinn's repository,
  // built into djinn and read only. Without a name, the index: a line per note, its name and what it is about (the
  // brief holds the same); with one, that note whole; with several (a,b) or --all, each whole, in one call. A lead
  // reads a note before it acts in its area; to add or fix
  // one, a lead that may change Djinn spawns a task that edits lead/notes.
  rpc Notes(LeadServiceNotesRequest) returns (LeadServiceNotesResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Wait for the events the lead must act on, and print them as one digest: a line per event (its code, its kind, a
  // few words; djinn task watch and djinn wish brief have the details) and the cursor to pass next. It blocks until
  // an event waits that this session has not acknowledged, then lets the events settle for 2 seconds of quiet (10 at
  // most) so that a burst, like an integration pass merging several tasks, comes as one digest; then it returns.
  // Called again with --after the cursor, it acknowledges every event up to it for this session, then waits for the
  // next ones: an event never acknowledged (the lead crashed, its session was lost) comes back on the next watch, at
  // least once, never lost. While a watch of the lead's session waits, Djinn types nothing in the lead's terminal;
  // without one, it types one short line, "Djinn: N events waiting, run djinn lead watch". The lead runs it as a
  // command its agent wakes it up for when it ends (djinn lead brief says how, for each agent). Refused while Djinn
  // drives the lead: Djinn hands each batch to a session of its own.
  rpc Watch(LeadServiceWatchRequest) returns (LeadServiceWatchResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Write to the lead in its terminal, as if you typed it there, then Enter: your own words, not an event of its
  // queue. The text waits while something is being typed there or a choice is on screen, then goes; texts arrive in
  // the order written. About a wish, it starts with "About wish <title> (<id>):". The lead must run in its terminal:
  // djinn lead resume starts it. While Djinn drives the lead, the text is an event of its queue instead, whole: the
  // next batch's session reads it, and a text written while a batch runs waits for the next one. A worker cannot
  // call it, and djinn mcp has no tool for it.
  rpc Tell(LeadServiceTellRequest) returns (LeadServiceTellResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
    option (djinn.v1.command_line_only) = true;
  }
  // The lead's journal while Djinn drives it: a paragraph per batch, the latest last, saying who led it (agent, model,
  // session), the events it took, the commands it ran, the text that ended its turn and what it cost. Each batch's
  // prompt carries the latest entries of its wishes; this prints them for the developer.
  rpc Journal(LeadServiceJournalRequest) returns (LeadServiceJournalResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Pick an option of the choice the lead's agent shows in its terminal (LeadServiceGetResponse.prompt), as its keys
  // would: the window's answer to an approval or a folder to trust. Refused when the screen shows another choice, or
  // none; the same choice is answered once. The window's only: an agent never answers its own approval.
  rpc Choose(LeadServiceChooseRequest) returns (LeadServiceChooseResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
}

// LeadPrompt is a choice the lead's agent shows in its terminal, waiting for the developer, as read from its screen:
// an approval (a command, an edit, the network), a folder to trust. The window shows it, and LeadService.Choose picks
// an option there, as the keys would.
message LeadPrompt {
  // The question, as the agent asks it: "Do you want to proceed?". Empty when the screen shows none.
  string title = 1;
  // What it is about, a line each, as on screen: the command, the file, the reason.
  repeated string lines = 2;
  // The options, in order, without their number.
  repeated string options = 3;
}

message LeadServiceSetRequest {
  // Identifier of the lead's session, as the agent names it.
  string session_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
  ];
  // Kind of agent: claude (the default), codex or antigravity.
  Provider provider = 2;
  // Folder the session runs in. By default, the folder of the first project. Never the home folder, nor a folder above it.
  string directory = 3 [(buf.validate.field).string.max_len = 4096];
}

message LeadServiceSetResponse {
  // The lead.
  Lead lead = 1;
}

message LeadServiceResumeRequest {
  // Kind of agent for the lead: unset or the recorded lead's resumes it; another starts a new lead of that agent
  // from the brief. Without a lead to resume, starts one of this kind: claude (the default), codex or antigravity.
  Provider provider = 1 [(buf.validate.field).enum.defined_only = true];
  // The wish to focus on in the lead's terminal: when set, types "Focus on the wish <title> (<id>): djinn wish brief <id>".
  string wish_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message LeadServiceResumeResponse {
  // The lead.
  Lead lead = 1;
  // Name of the lead's terminal in the window ("lead").
  string terminal = 2;
  // The command line the terminal runs, program first.
  repeated string command = 3;
  // Its working directory.
  string directory = 4;
  // The lead was already running: the window attached to it, nothing was started.
  bool attached = 5;
  // What to know, when there is something: no session to resume, a terminal that runs something else.
  string note = 6;
}

message LeadServiceGetRequest {}

message LeadServiceGetResponse {
  // The lead, or unset if none is recorded.
  Lead lead = 1;
  // The choice the lead's agent shows in its terminal now, waiting for the developer; unset when it shows none, or
  // the lead does not run. Read from its screen, never stored.
  LeadPrompt prompt = 2;
  // How the lead's last program in its terminal ended: kept, with its output, until Lead (LeadService.Resume) starts
  // the lead again, so a lead that ended at once stays visible. Unset while it runs, or when none ran since Djinn
  // started. Never stored.
  LeadExit exit = 3;
  // Why the last LeadService.Resume could not start the lead, as it answered: kept until one starts or attaches to
  // it. While Djinn drives the lead, why its last batch failed twice, until a batch ends its turn. Never stored.
  string start_error = 4;
  // Djinn drives the lead (decision Q31): a fresh headless session per batch of events, no terminal.
  bool driven = 5;
  // The batch that runs, or else the last one, while Djinn drives the lead.
  LeadBatch batch = 6;
}

// LeadExit is how the program of the lead's terminal ended.
message LeadExit {
  // Its exit code: 0 for a program that ended without an error.
  int32 code = 1;
}

message LeadServiceWatchRequest {
  // The cursor the last watch printed: every event up to it is acknowledged for this session before waiting. Empty:
  // nothing is acknowledged, every event the session has not acknowledged comes.
  string after = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // The lead session that watches, as its agent names it; by default the one its agent gives its commands
  // ($CLAUDE_CODE_SESSION_ID, $CODEX_THREAD_ID, $ANTIGRAVITY_CONVERSATION_ID), else the recorded lead's. A session
  // other than the recorded lead's is refused: djinn lead set records it.
  string session = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$",
    (djinn.v1.env) = "CLAUDE_CODE_SESSION_ID CODEX_THREAD_ID ANTIGRAVITY_CONVERSATION_ID"
  ];
  // How long to wait for an event before returning an empty digest, to run again; by default an hour, at most 6
  // hours. 0s returns at once, events or not: for an agent no finished command wakes up (Codex).
  google.protobuf.Duration timeout = 3;
}

message LeadServiceWatchResponse {
  // The digest: a line per event, then the cursor and the command to run next.
  string text = 1;
}

message LeadServiceTellRequest {
  // What to say to the lead. Line breaks stay line breaks for an agent that takes a paste.
  string text = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 20000
  ];
  // The wish the text is about, if any.
  string wish_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message LeadServiceTellResponse {
  // The text waits in the lead's terminal: something is being typed there, or a choice is on screen. It goes once
  // they are done.
  bool waiting = 1;
}

message LeadServiceJournalRequest {
  // Only the batches about this wish.
  string wish_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // How many batches, the latest; 10 by default.
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
}

message LeadServiceJournalResponse {
  // The journal, in Markdown: a paragraph per batch, the latest last.
  string text = 1;
}

message LeadServiceChooseRequest {
  // The option picked, from 1.
  int32 option = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 20
  }];
  // The choice as the window showed it, title, lines and options: the screen must still show that one.
  string title = 2 [(buf.validate.field).string.max_len = 2000];
  // The command, file or reason shown: identical options alone do not identify an approval.
  repeated string lines = 3 [(buf.validate.field).repeated.max_items = 200];
  repeated string options = 4 [(buf.validate.field).repeated.max_items = 20];
}

message LeadServiceChooseResponse {}

message LeadServiceBriefRequest {
  // Only where the wishes stand: each active wish, then the paused and granted ones in a line each, without Djinn's
  // rules nor the projects'. Short enough that no agent's tool cuts it.
  bool wishes = 1;
}

message LeadServiceBriefResponse {
  // The brief, in Markdown.
  string text = 1;
}

message LeadServiceNotesRequest {
  // A note's name, as the index lists it: that note whole. Several, separated by commas (a,b): each of them whole,
  // in one call. Empty: the index.
  string name = 1 [
    (djinn.v1.positional) = true,
    (buf.validate.field).string.max_len = 2000
  ];
  // Every note whole, in one call.
  bool all = 2;
}

message LeadServiceNotesResponse {
  // The index, or the note, in Markdown.
  string text = 1;
}

// A block is free content of a wish, laid out by the lead: a decision taken outside a question, a section of
// analysis, a line of the journal, a diagram. Djinn computes nothing from it, and shows a kind it does not know as
// text: nothing is lost.
message Block {
  // Identifier, a UUIDv7.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Wish the block belongs to.
  string wish_id = 2;
  // Task the block is about, if any.
  string task_id = 3;
  // What the block is, in a word the lead chooses: decision, section, log, diagram, report…
  string kind = 4;
  // Title, in a line.
  string title = 5;
  // Order within the wish, lowest first. New blocks go 1000 after the last one, so that a block slips between
  // two others without moving them.
  int64 position = 6;
  // Media type of the content: text/markdown when empty, or another, like application/json.
  string media_type = 7;
  // The content.
  string content = 8;
  // When the block was created.
  google.protobuf.Timestamp create_time = 9;
  // When it last changed.
  google.protobuf.Timestamp update_time = 10;
  // Marks a block took before blocks were for agents only: none is put any more, and none is listed.
  repeated Mark marks = 11;
  // One emoji for its subject, set by its writer (djinn block put --icon 🧱): the decision log shows it first. Empty:
  // a default by kind.
  string icon = 12 [(buf.validate.field).string.max_len = 16];
}

// Blocks: the free content of a wish, beside its tasks and questions.
service BlockService {
  // Add a block to a wish, or change one: given its id, the fields set replace those of the block.
  rpc Put(BlockServicePutRequest) returns (BlockServicePutResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // List the blocks of a wish, in order.
  rpc List(BlockServiceListRequest) returns (BlockServiceListResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Delete a block.
  rpc Delete(BlockServiceDeleteRequest) returns (BlockServiceDeleteResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_DELETE;
  }
}

message BlockServicePutRequest {
  // Wish the block belongs to.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // The block to change; a new block when empty.
  string id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // What the block is, in a word: decision, section, log, diagram, report…
  string kind = 3 [(buf.validate.field).string.max_len = 100];
  // Title, in a line.
  string title = 4 [(buf.validate.field).string.max_len = 1000];
  // The content, Markdown unless --media-type says otherwise.
  string content = 5 [(buf.validate.field).string.max_len = 1000000];
  // Media type of the content, like application/json; text/markdown by default.
  string media_type = 6 [(buf.validate.field).string.max_len = 200];
  // Task the block is about, whose worker wrote it: the decision log says "by W12". By default $DJINN_TASK_ID,
  // which Djinn sets for every worker; empty for the lead.
  string task_id = 7 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true,
    (djinn.v1.env) = "DJINN_TASK_ID"
  ];
  // Order within the wish; by default 1000 after the last block, for a new one.
  int64 position = 8;
  // One emoji for the subject, like 🧱: the decision log shows it before a decision.
  string icon = 9 [(buf.validate.field).string.max_len = 16];
}

message BlockServicePutResponse {
  // The block.
  Block block = 1;
}

message BlockServiceListRequest {
  // The wish.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // Only the blocks of this kind, case ignored.
  string kind = 2 [(buf.validate.field).string.max_len = 100];
  // Only the blocks about this task.
  string task_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // The most blocks to return. Not set: 50. Max: 200.
  int32 page_size = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // The page token from a previous list response, to fetch the next page.
  string page_token = 5 [(buf.validate.field).string.max_len = 500];
}

message BlockServiceListResponse {
  // The blocks, by position.
  repeated Block blocks = 1;
  // Token to retrieve the next page, or empty if there are no more pages.
  string next_page_token = 2;
  // Total number of blocks matching the request.
  int32 total = 3;
}

message BlockServiceDeleteRequest {
  // The block.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message BlockServiceDeleteResponse {}

// Marks: what the developer read or approved from the window, on questions, decisions and blocks, so that the lead
// acts on a click without a word.
service MarkService {
  // Mark a question: read, or approved as it is. Approving an open question answers it with the option its
  // recommendation names, as djinn question answer does. Mark a task reviewed, once its diff was read. A block takes
  // no mark: blocks are for agents.
  rpc Put(MarkServicePutRequest) returns (MarkServicePutResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // List the marks on a wish's questions and tasks, the latest last.
  rpc List(MarkServiceListRequest) returns (MarkServiceListResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// MarkTarget points to the question or the task a mark is on, by its code or its identifier. A block's identifier is
// refused.
message MarkTarget {
  oneof ref {
    option (buf.validate.oneof).required = true;
    // A question's code, like Q03.
    string code = 1 [(buf.validate.field).string.pattern = "^Q[0-9]{2,3}$"];
    // The identifier of a question, or of a task.
    string id = 2 [(buf.validate.field).string.uuid = true];
    // A task's code, like W3: a task takes the mark reviewed.
    string task = 3 [(buf.validate.field).string.pattern = "^[Ww][0-9]{1,4}$"];
  }
}

// Marked is a mark with the question or the task it is on.
message Marked {
  // Wish of the question.
  string wish_id = 1;
  // The question marked.
  string question_id = 2;
  // Unused: a block takes no mark any more.
  string block_id = 3;
  // The question's code.
  string label = 4;
  // The question's text, in a line.
  string title = 5;
  // The mark.
  Mark mark = 6;
  // The task marked, for a mark on a task; then label is its code and title its title.
  string task_id = 7;
}

message MarkServicePutRequest {
  // What to mark: a question's code, like Q03, a task's, like W3, or the identifier of either.
  MarkTarget target = 1 [(buf.validate.field).required = true];
  // The mark: read, or approved, on a question; reviewed, on a task.
  MarkKind kind = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // Wish of the question or task, needed only when its code exists in several wishes.
  string wish_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // Take the mark off instead. An answer stays.
  bool remove = 4;
}

message MarkServicePutResponse {
  // The mark, and what it is on.
  Marked marked = 1;
}

message MarkServiceListRequest {
  // The wish.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message MarkServiceListResponse {
  // The marks, the latest last.
  repeated Marked marks = 1;
}

// Tasks: one worker each, an agent process in the task's own worktree.
service TaskService {
  // Start a worker on a new task: in a Git project, in a new worktree on its own branch. A task that cannot start
  // yet (a dependency not done, its write scope taken, no slot free, the machine under pressure) waits, and says
  // why; djinn up starts it as soon as it can. --after gives it what comes before it; --blocks puts it before planned
  // tasks, in the same step, so that none of them starts in between.
  rpc Spawn(TaskServiceSpawnRequest) returns (TaskServiceSpawnResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // List the tasks, the oldest first.
  rpc List(TaskServiceListRequest) returns (TaskServiceListResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Show a task.
  rpc Get(TaskServiceGetRequest) returns (TaskServiceGetResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // File diff of a task against its base: with no file given, the files changed and their counts; with a file, the
  // unified diff of that file with syntax tokens, by chunks of 2 000 lines at most: --offset asks for the next one.
  // --uncommitted shows what the task's worktree holds not committed instead.
  rpc Diff(TaskServiceDiffRequest) returns (TaskServiceDiffResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Stop a task's worker: asked to stop, then killed if it has not after a few seconds. A planned task that has not
  // started is stopped at once.
  rpc Stop(TaskServiceStopRequest) returns (TaskServiceStopResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Pause a running worker without killing it: it holds still, keeps what it did, and frees its slot of the machine
  // until it is resumed. A worker that holds or waits for a gate is not paused: wait, or stop it. Not possible on
  // Windows yet.
  rpc Pause(TaskServicePauseRequest) returns (TaskServicePauseResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Let a paused worker go on where it was.
  rpc Resume(TaskServiceResumeRequest) returns (TaskServiceResumeResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Start a planned task that waits for the machine (no slot free, or the machine under pressure) now, anyway. A
  // task that waits for anything else (its wish, a dependency, a write scope) keeps waiting. Its worker takes a slot
  // all the same, beyond what the load bar lets run: the bar counts it among the workers started by hand.
  rpc Start(TaskServiceStartRequest) returns (TaskServiceStartResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Follow a task's events as they come, from the first one or after a position; ends with the task.
  rpc Watch(TaskServiceWatchRequest) returns (stream TaskServiceWatchResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
  }
  // Remove the worktree of a finished task. Its branch stays.
  rpc Clean(TaskServiceCleanRequest) returns (TaskServiceCleanResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_DELETE;
  }
  // Set what a task waits for: the tasks of its wish that must be done first (--after), in place of those it had; with
  // --also, several tasks at once, all or none. The tasks of a wish form a graph without cycle: a dependency that
  // would close one is refused, naming it, and nothing changes. A task not started yet waits for its new
  // dependencies; a finished one only records them; one whose worker runs is refused until it ends. To put a new
  // task before a planned one, spawn it with --blocks instead: a pass of the scheduler could start the planned one
  // between a spawn and a depend.
  rpc Depend(TaskServiceDependRequest) returns (TaskServiceDependResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Set the azima a task is part of, in place of the one it had: an azima of its wish, by code (T07) or
  // identifier; none takes it out of any. A grouping, never a wait: the task still waits only for what it depends on.
  // One that would close a cycle with what the tasks depend on is refused, naming it; so is a task whose worker runs,
  // until it ends.
  rpc Group(TaskServiceGroupRequest) returns (TaskServiceGroupResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Delete a task no worker of this Djinn ran (a plan item, a task imported from another Djinn): it goes with its
  // events. A task a worker of this Djinn ran stays, as the record of that work.
  rpc Delete(TaskServiceDeleteRequest) returns (TaskServiceDeleteResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_DELETE;
  }
  // Mark a task done that no worker runs now: planned, waiting, cut short, failed, stopped or imported. It records
  // who closed it, when and why; a task waiting on it may start. A running or paused task is stopped first; a task
  // done already is refused, but one its permissions refused calls of (Task.refused): it is closed as seen, and its
  // wish may be proposed for the grant. A task no longer useful is cancelled (Cancel), not marked done.
  rpc Done(TaskServiceDoneRequest) returns (TaskServiceDoneResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Cancel a task: stops its worker if it runs or is paused, records who cancelled it, when and why, removes its
  // worktree while keeping the branch, and drops its work from integration. Refused on a task done or cancelled
  // already, and on an azima.
  rpc Cancel(TaskServiceCancelRequest) returns (TaskServiceCancelResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Continue a task no worker runs (done, failed, stopped, cut short) where it stopped: a new turn of its own
  // session, in its own worktree and branch, with the prompt. It goes back to the scheduler, like a planned task.
  // Refused while it runs, when its worktree is gone, or when its agent cannot resume a session. To start another
  // task from its context, fork it instead (djinn task spawn --fork).
  rpc Continue(TaskServiceContinueRequest) returns (TaskServiceContinueResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Send a message to a running worker: an instruction added while it works. The message is an event of the task,
  // and a "received" event follows once the worker says something after it.
  rpc Send(TaskServiceSendRequest) returns (TaskServiceSendResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Update a task: only the fields given change. A task not started (planned, waiting) may change everything; a running
  // or paused task may change its title only; a finished task (done, failed, stopped, cut short) may change title,
  // provider, model, prompt (for its next continue), azima, and integration (none clears it, pending puts its work back in
  // line), never its dependencies once it ran. An azima changes its title, whatever its state, written back to its plan
  // file's heading when it has one; or its branch, alone.
  rpc Update(TaskServiceUpdateRequest) returns (TaskServiceUpdateResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
    option (djinn.v1.method_alias) = "set-agent";
  }
  // Edit the description of an azima.
  rpc Describe(TaskServiceDescribeRequest) returns (TaskServiceDescribeResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Open a draft azima: turns it open, ready for parts to be spawned, and notifies the wish's lead.
  rpc Open(TaskServiceOpenRequest) returns (TaskServiceOpenResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Move an azima (a draft, or an azima no worker runs with parts that have not started) to another wish.
  rpc Move(TaskServiceMoveRequest) returns (TaskServiceMoveResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Comment on a line or range of lines of a task's diff: stored on the task with its file, line range, commit, and
  // excerpt. While the task's worker runs, the comment is sent to it as an instruction (djinn task send); otherwise it
  // waits for TaskService.TurnComments.
  rpc Comment(TaskServiceCommentRequest) returns (TaskServiceCommentResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Turn the comments of an ended task that went to no worker and are not resolved into work: continues the task when
  // it can be continued (djinn task continue), or spawns a correction task in its azima whose prompt quotes each
  // comment with its code excerpt. Each comment then records the task it went to.
  rpc TurnComments(TaskServiceTurnCommentsRequest) returns (TaskServiceTurnCommentsResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
}

message TaskServiceSpawnRequest {
  // Wish the task belongs to.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // What the task does, in a sentence.
  string title = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 500
  ];
  // Project to work in; by default the wish's project, when it has only one. For a wish without any project, the
  // task runs outside any project: read-only, in an empty folder of its own.
  string project_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // What to ask the worker; by default the title.
  string prompt = 4 [(buf.validate.field).string.max_len = 200000];
  // Kind of agent; by default claude.
  Provider provider = 5 [(buf.validate.field).enum.defined_only = true];
  // Model of the agent; by default the provider's.
  string model = 6 [(buf.validate.field).string.max_len = 200];
  // Most the worker may spend, in US dollars, when the provider can enforce it.
  double max_budget_usd = 7 [(buf.validate.field).double.gte = 0];
  // Same as after, the name it had: kept so that what spawns with --depends-on still works.
  repeated string depends_on = 8 [
    (buf.validate.field).repeated.max_items = 100,
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.max_len = 1000
  ];
  // A path the task writes, in the project's folder; none for the whole folder. Outside Git, tasks whose scopes
  // overlap never run together.
  repeated string write_scopes = 9 [
    (buf.validate.field).repeated.max_items = 100,
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.max_len = 1000
  ];
  // Only plan the task: the call returns at once, and djinn up starts the worker when the task is ready.
  bool later = 10;
  // Start the worker from a copy of this task's conversation (its code, W1, or its identifier), with a session of
  // its own, instead of from the prompt alone. The inherited context is read again at every turn: prefer a short
  // prompt, the default. Claude and Codex fork; Antigravity cannot.
  string fork = 11 [(buf.validate.field).string.max_len = 64];
  // Start the worker from a copy of the lead's conversation, as --fork does from a task.
  bool from_lead = 12;
  // For a watcher (--provider watch): start its command again after an exit 0 too, until the task is stopped; one
  // that dies starts again anyway.
  bool restart = 13;
  // The decision the task comes from: an answered question's code (Q43), or the id of a block of kind decision. The
  // decision log links to the task, and the task to its decision.
  string decision = 14 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^([Qq][0-9]{2,3}|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$"
  ];
  // The azima the task belongs to: its code (T07) or its identifier. A grouping, never a wait: say what the task
  // waits for with after.
  string part_of = 15 [(buf.validate.field).string.max_len = 64];
  // What the task is; by default work, for a worker. azima makes an azima (T1, T2…): no worker, no prompt, never
  // scheduled; work is spawned part of it. ifrit makes an ifrit: an agent that stays lit while you are there, to
  // iterate with you through the lead (djinn task send), in a project.
  TaskKind kind = 16 [(buf.validate.field).enum.defined_only = true];
  // What comes before the task: tasks of the same wish that must be done first, by code (W1, T07) or identifier.
  // Repeat it, or separate them with commas: --after W1,W2. Give a task what comes before it here, at its spawn.
  repeated string after = 17 [
    (buf.validate.field).repeated.max_items = 100,
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.max_len = 1000
  ];
  // What comes after the task: planned tasks of the same wish, by code or identifier, that wait for it from now on.
  // Each one gets the new task as one more dependency, in the same step as the spawn, so that no scheduler pass
  // starts it in between. Refused for a task that has started (running, paused, done…) and for one that would close
  // a cycle. Repeat it, or separate them with commas: --blocks W5,W6.
  repeated string blocks = 18 [
    (buf.validate.field).repeated.max_items = 100,
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.max_len = 1000
  ];
  // A tilasm of the wish given to the worker as context, by code (L01) or identifier: the worker's first prompt holds
  // its text and the folder of its files. Repeat it, or separate them with commas: --tilasm L01,L02.
  repeated string tilasm = 19 [
    (buf.validate.field).repeated.max_items = 20,
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.max_len = 1000
  ];
  // For an azima: mark it as a draft (AzimaState.AZIMA_STATE_DRAFT), not ready to spawn parts into.
  bool draft = 20;
  // For an azima: its description, explaining its purpose or design before it is opened.
  string description = 21 [(buf.validate.field).string.max_len = 20000];
  // A watcher that babysits a pull or merge request with the project's babysit skill (metadata.djinn.babysit): its
  // command, its restart and its done line come from the skill, the prompt and the provider need not be given. The
  // request is found as it starts: the one a task of after opened, else the one open for the wish's branch.
  bool babysit = 22;
  // For an ifrit (--kind ifrit): minutes without you in Djinn before Djinn puts it out, 5 to 240, as when you go and
  // test for an hour. By default this machine's: djinn up --ifrit-idle, else the window's settings, else 30.
  uint32 idle_minutes = 23 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).uint32 = {
      gte: 5
      lte: 240
    }
  ];
}

message TaskServiceSpawnResponse {
  // The task: running, or waiting with its reason.
  Task task = 1;
  // What the spawner should know of where the task runs: its worker cannot run djinn, which its prompt asks of it,
  // and how to grant it. Empty when nothing is to say.
  string note = 2;
}

message TaskServiceListRequest {
  // Only the tasks of this wish.
  string wish_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // Only the tasks in this project.
  string project_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // The most tasks to return. Not set: 50. Max: 200.
  int32 page_size = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  // The page token from a previous list response, to fetch the next page.
  string page_token = 4 [(buf.validate.field).string.max_len = 500];
  // Only the failed tasks that wait for the lead.
  bool failed = 5;
  // Each task in a few fields: its code, title, status, kind, azima, what it waits for and its times; no prompt, no
  // runs, no resources. Where the tasks stand, in a few lines each.
  bool short = 6;
}

message TaskServiceListResponse {
  // The tasks.
  repeated Task tasks = 1;
  // Token to retrieve the next page, or empty if there are no more pages.
  string next_page_token = 2;
  // Total number of tasks matching the request.
  int32 total = 3;
}

message TaskServiceGetRequest {
  // The task.
  string task_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message TaskServiceGetResponse {
  // The task.
  Task task = 1;
}

// The change status of a file in a diff.
enum DiffStatus {
  DIFF_STATUS_UNSPECIFIED = 0;
  DIFF_STATUS_MODIFIED = 1;
  DIFF_STATUS_ADDED = 2;
  DIFF_STATUS_DELETED = 3;
  DIFF_STATUS_RENAMED = 4;
  DIFF_STATUS_COPIED = 5;
}

// Kind of line in a unified diff hunk.
enum DiffLineKind {
  DIFF_LINE_KIND_UNSPECIFIED = 0;
  DIFF_LINE_KIND_CONTEXT = 1;
  DIFF_LINE_KIND_ADDED = 2;
  DIFF_LINE_KIND_DELETED = 3;
  DIFF_LINE_KIND_HUNK = 4;
}

// A syntax-highlighted token in a diff line.
message DiffToken {
  // Text content of the token.
  string text = 1;
  // Syntax category for theme colouring (keyword, string, comment, number, type, function, operator, etc.).
  string category = 2;
}

// A single line within a diff hunk.
message DiffLine {
  // Kind of diff line: context, added, deleted, or hunk header.
  DiffLineKind kind = 1;
  // Line number in the old file (1-based, 0 if added).
  int32 old_line = 2;
  // Line number in the new file (1-based, 0 if deleted).
  int32 new_line = 3;
  // Text content of the line without prefix.
  string text = 4;
  // Syntax tokens for the line text.
  repeated DiffToken tokens = 5;
}

// A hunk in a unified diff.
message DiffHunk {
  // Hunk header text, e.g. "@@ -10,6 +10,8 @@ func main()".
  string header = 1;
  // Starting line number in the old file.
  int32 old_start = 2;
  // Number of lines in the old file hunk.
  int32 old_lines = 3;
  // Starting line number in the new file.
  int32 new_start = 4;
  // Number of lines in the new file hunk.
  int32 new_lines = 5;
  // The lines belonging to this hunk.
  repeated DiffLine lines = 6;
  // The hunk began in an earlier chunk, where its header was: these lines carry it on.
  bool continued = 7;
}

// A file changed by a task, with added/deleted line counts and flags.
message TaskDiffFile {
  // Path of the file, relative to the repository root.
  string path = 1;
  // Previous path when the file was renamed.
  string old_path = 2;
  // Number of lines added.
  int32 added = 3;
  // Number of lines deleted.
  int32 deleted = 4;
  // Whether the file is binary.
  bool binary = 5;
  // Whether the file was renamed.
  bool renamed = 6;
  // Whether the file matches generated globs.
  bool generated = 7;
  // Whether the file is a package or dependency lock file.
  bool lock = 8;
  // Whether the file should be folded by default in the diff view (generated || lock || binary).
  bool folded = 9;
  // Change status of the file.
  DiffStatus status = 10;
}

// The diff of a single file, or one chunk of it when it is long: its hunks and its lines from offset on.
message TaskFileDiff {
  reserved 11, 13;
  reserved "too_large", "command";
  // Path of the file, relative to the repository root.
  string path = 1;
  // Previous path when renamed.
  string old_path = 2;
  // Change status.
  DiffStatus status = 3;
  // Whether the file is binary.
  bool binary = 4;
  // Whether the file matches generated globs.
  bool generated = 5;
  // Whether the file is a lock file.
  bool lock = 6;
  // Whether folded by default.
  bool folded = 7;
  // Total lines added in this file.
  int32 added = 8;
  // Total lines deleted in this file.
  int32 deleted = 9;
  // Unified diff hunks with syntax tokens, of this chunk's lines only.
  repeated DiffHunk hunks = 10;
  // Lines of the whole unified diff of the file, its header included.
  int32 total_lines = 12;
  // Unified diff patch text of this chunk's lines, as git prints them.
  string patch = 14;
  // First line of the diff in this chunk, from 0.
  int32 offset = 15;
  // Where the next chunk starts: ask for it with this offset. 0 when this chunk ends the file's diff.
  int32 next_offset = 16;
}

// Reference to a task, by code (W1, T07) or by UUID.
message TaskRef {
  oneof ref {
    option (buf.validate.oneof).required = true;
    // Short code, like W1 or T07.
    string code = 1 [(buf.validate.field).string.pattern = "^[WTwt][0-9]{1,4}$"];
    // Identifier, a UUID.
    string id = 2 [(buf.validate.field).string.uuid = true];
  }
}

message TaskServiceDiffRequest {
  // Task to inspect.
  TaskRef task = 1 [
    (buf.validate.field).required = true
  ];
  // File path to show unified diff for. When empty, returns the list of changed files.
  string file = 2 [
    (buf.validate.field).string.max_len = 1000
  ];
  // Wish identifier when task is given by code and wish cannot be inferred from context.
  string wish_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // First line of the file's diff to show, from 0: a long diff comes by chunks, each one giving the next one's offset.
  int32 offset = 4 [(buf.validate.field).int32.gte = 0];
  // Lines of the file's diff to show from the offset. 0: 2 000, the most a chunk holds.
  int32 limit = 5 [(buf.validate.field).int32 = {
    gte: 0
    lte: 2000
  }];
  // Show what the task's worktree holds not committed instead of its committed work: the changes to tracked files,
  // staged or not, and the untracked files, against the worktree's HEAD, the project's .gitignore applying.
  bool uncommitted = 6;
}

message TaskServiceDiffResponse {
  // Changed files with line counts and folded flags (when no file is requested).
  repeated TaskDiffFile files = 1;
  // Diff for the requested file (when file is requested).
  TaskFileDiff file = 2;
  // Base commit or ref used for comparison.
  string base = 3;
  // Head commit or ref used for comparison; empty for uncommitted, which compares base with the worktree's files.
  string head = 4;
  // For uncommitted: the task has no worktree, never made or removed once its work merged, so nothing to show.
  bool no_worktree = 5;
}

message TaskServiceStopRequest {
  // The task.
  string task_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message TaskServiceStopResponse {
  // The task, stopped.
  Task task = 1;
}

message TaskServiceSendRequest {
  // The task, running.
  string task_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // The message, as the worker reads it.
  string text = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 20000
  ];
}

message TaskServiceSendResponse {
  // The message, as an event of the task.
  TaskEvent event = 1;
}

message TaskServicePauseRequest {
  // The task.
  string task_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message TaskServicePauseResponse {
  // The task, paused.
  Task task = 1;
}

message TaskServiceResumeRequest {
  // The task.
  string task_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message TaskServiceResumeResponse {
  // The task, running again.
  Task task = 1;
}

message TaskServiceStartRequest {
  // The task.
  string task_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message TaskServiceStartResponse {
  // The task, its worker started.
  Task task = 1;
}

message TaskServiceWatchRequest {
  // The task.
  string task_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // Only the events after this position, to resume where a reader left off.
  int64 after_seq = 2 [(buf.validate.field).int64.gte = 0];
  // Also send each event's raw line from the provider.
  bool raw = 3;
  // Only the last events already stored, this many (a task that ended: its final note is among them), then the ones
  // that come. Not set: from the first one, or after after_seq.
  int32 last = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
}

message TaskServiceWatchResponse {
  // The next event.
  TaskEvent event = 1;
}

message TaskServiceCleanRequest {
  // The task.
  string task_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // Remove the worktree even when it holds changes not committed.
  bool force = 2;
}

message TaskServiceCleanResponse {
  // The task, without its worktree.
  Task task = 1;
}

message TaskServiceDependRequest {
  // The task.
  string task_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // Same as after, the name it had: kept so that what depends with --depends-on still works.
  repeated string depends_on = 2 [(buf.validate.field).repeated.items.string.min_len = 1];
  // What comes before the task: tasks of the same wish that must be done first, by code (W1, T07) or identifier.
  // Repeat it, or separate them with commas: --after W1,W2. None leaves the task waiting for nothing.
  repeated string after = 3 [
    (buf.validate.field).repeated.max_items = 100,
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.max_len = 1000
  ];
  // Other tasks of the wish whose dependencies are set in the same step, all or none: --also W6=W5,W3 sets what W6
  // waits for, --also W7= clears it. The graph they make together has no cycle, or nothing changes.
  repeated TaskAfter also = 4 [(buf.validate.field).repeated.max_items = 100];
}

// What one task waits for, in place of what it had.
message TaskAfter {
  // The task: its code (W6) or its identifier.
  string task = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 64
  ];
  // What comes before it: tasks of the same wish, by code or identifier; none for nothing.
  repeated string after = 2 [
    (buf.validate.field).repeated.max_items = 100,
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.max_len = 1000
  ];
}

message TaskServiceDependResponse {
  // The task, with its dependencies.
  Task task = 1;
  // The other tasks set (--also), in the order asked.
  repeated Task also = 2;
}

