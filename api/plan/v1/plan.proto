// The plan of a wish as a graph of azimas: tasks of kind AZIMA that no worker runs, which work is part of. The store
// holds the graph; a project's plan/ folder holds one Markdown file per azima, for Git to carry.
service PlanService {
  // Read the plan files of the wish's projects (plan/*.md: the front matter's id, code, phase and status, and the
  // title) into the wish's azimas: make the missing ones, update the others, without touching what they depend on.
  // A file whose status is done, or whose Done-when boxes are all checked (reported in all_checked), marks its azima
  // done; read not done again, an azima it closed opens again. The unchecked boxes that wait for a proof no worker can
  // give, "(needs: …)", are kept on the azima (Task.proof_needs) when no other box is left. Then
  // write what each azima depends on back into its file's front matter, as "after: T02 T05", so that Git carries the
  // graph. The store stays the source of truth: an azima made here takes its file's after line, once.
  rpc Sync(PlanServiceSyncRequest) returns (PlanServiceSyncResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
}

message PlanServiceSyncRequest {
  // The wish.
  string wish_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // Only this project's plan folder; by default every project of the wish that has one.
  string project_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message PlanServiceSyncResponse {
  // The azimas of the files read, as the store holds them now, by code.
  repeated Task azimas = 1;
  // The codes of the azimas made, and of those changed.
  repeated string made = 2;
  repeated string changed = 3;
  // The files whose after line was written, as their project names them.
  repeated string written = 4;
  // The files whose status says not done while every box of their Done-when section is checked: their azimas count
  // as done. Set their status to done.
  repeated string all_checked = 5;
}
