  string wish = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // The .zip to write; a relative path starts from the current directory. By default, the tilasm's title with .zip in
  // the Downloads folder.
  string file = 3 [(buf.validate.field).string.max_len = 4096];
  // For a Markdown tilasm, its latest text alone, as a .md named after its title, rather than a .zip; refused for an
  // HTML tilasm.
  bool markdown = 4;
}

message TilasmServiceExportResponse {
  // The file written.
  string file = 1;
  // Its size, in bytes.
  int64 size = 2;
}

message TilasmServiceImportRequest {
  // The .zip to import, as djinn tilasm export writes it; a relative path starts from the current directory.
  string file = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 4096
  ];
  // The wish to import it into.
  string wish = 2 [(buf.validate.field).string.uuid = true];
  // Who imports it; the author of the file's tilasm by default.
  string author = 3 [(buf.validate.field).string.max_len = 100];
