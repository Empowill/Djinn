syntax = "proto3";

package plan.v1;

import "buf/validate/validate.proto";
import "djinn/v1/options.proto";
import "google/protobuf/timestamp.proto";

// A tilasm is the material that explains a wish: a concept drawn, a data model walked through, a comparison laid out.
// A support, as the window calls it: a Markdown document, index.md, that the developer and the agents write together;
// or, when one is asked for, an HTML page, a folder with an index.html and its sources. Kept in Djinn's data folder,
// tilasms/<id>/v<n>/, never in a project. Putting it again adds a version; the latest is what its links show. The word
// comes from the Arabic ṭilasm, the origin of "talisman".
message Tilasm {
  option (djinn.v1.unique) = {fields: ["wish_id", "code"]};

  // Identifier, a UUIDv7. Its links name it: djinn://tilasm/<id>.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Wish the tilasm belongs to.
  string wish_id = 2;
  // Short code to dictate, like L01, unique within the wish.
  string code = 3 [(buf.validate.field).string.pattern = "^L[0-9]{2,3}$"];
  // Title, in a line.
  string title = 4 [(buf.validate.field).string.max_len = 1000];
  // Who made it: a task's code (W12), the lead, the developer.
  string author = 5 [(buf.validate.field).string.max_len = 100];
  // Its versions, the first first; the last one is the tilasm as its links show it.
  repeated TilasmVersion versions = 6;
  // The azimas and tasks of the wish it explains, by identifier.
  repeated string cites = 7;
  // When it was made.
  google.protobuf.Timestamp create_time = 8;
  // When its last version was put.
  google.protobuf.Timestamp update_time = 9;
  // Most a version may hold, in bytes, its files summed: a put beyond it is refused, saying so.
  int64 max_bytes = 10;
  // What its versions hold: a Markdown document or an HTML page. It never changes. Unspecified: an HTML page, put
  // before tilasms had a format.
  TilasmFormat format = 11;
  // Grows by one at each write of its content: a put, a save, a restore, an import. A save names the revision it
  // started from, and is refused when the tilasm has moved on since.
  int64 revision = 12;
}

// TilasmFormat is what a tilasm's versions hold.
enum TilasmFormat {
  // Not set: an HTML page, put before tilasms had a format.
  TILASM_FORMAT_UNSPECIFIED = 0;
  // A folder with an index.html and its sources, read only in the window.
  TILASM_FORMAT_HTML = 1;
  // A Markdown document, index.md, with the files it links beside it: edited in the window.
  TILASM_FORMAT_MARKDOWN = 2;
}

// TilasmOrigin is how a version came to be.
enum TilasmOrigin {
  // Not set: a put, recorded before versions had an origin.
  TILASM_ORIGIN_UNSPECIFIED = 0;
  // djinn tilasm put, a folder, a .zip or a .md.
  TILASM_ORIGIN_PUT = 1;
  // djinn tilasm create, or a new document in the window.
  TILASM_ORIGIN_CREATE = 2;
  // A save of the window's editor.
  TILASM_ORIGIN_SAVE = 3;
  // A restore of an earlier version.
  TILASM_ORIGIN_RESTORE = 4;
  // An export imported, or files dropped on the window.
  TILASM_ORIGIN_IMPORT = 5;
  // A proposal the developer accepted.
  TILASM_ORIGIN_PROPOSAL = 6;
}

// TilasmVersion is one put of a tilasm: its files stay in tilasms/<id>/v<number>/.
message TilasmVersion {
  // Its number, from 1.
  int32 number = 1;
  // When it was put.
  google.protobuf.Timestamp create_time = 2;
  // Who put it.
  string author = 3 [(buf.validate.field).string.max_len = 100];
  // Its files summed, in bytes.
  int64 size = 4;
  // How many files it holds.
  int32 files = 5;
  // The version it copies, when it was restored from an earlier one; 0 otherwise.
  int32 restored_from = 6;
  // How it came to be.
  TilasmOrigin origin = 7;
  // The tilasm's revision its content holds. A save by the same author within minutes of it rewrites the version in
  // place, which takes the save's revision, so that the history keeps one version per sitting.
  int64 revision = 8;
  // When its content was last written: its create_time, unless a save rewrote it.
  google.protobuf.Timestamp update_time = 9;
}

// TilasmRef points to a tilasm by its code or by its identifier.
message TilasmRef {
  oneof ref {
    option (buf.validate.oneof).required = true;
    // Short code, like L01.
    string code = 1 [(buf.validate.field).string.pattern = "^[Ll][0-9]{2,3}$"];
    // Identifier, a UUID.
    string id = 2 [(buf.validate.field).string.uuid = true];
  }
}

// TilasmExport is a tilasm with the files of its versions, as an export carries it: alone in tilasm.json beside its
// files, or within a wish's export.
message TilasmExport {
  // The tilasm.
  Tilasm tilasm = 1;
  // The codes of what it cites, in the order of its cites (T29, W12): another wish finds them by code.
  repeated string cite_codes = 2;
  // Its files, version by version; a tilasm exported alone carries its files beside tilasm.json instead.
  repeated TilasmFile files = 3;
  // Its discussions, the first made first.
  repeated TilasmThread threads = 4;
  // Its proposals, the first made first.
  repeated TilasmProposal proposals = 5;
}

// TilasmAnchor points to a passage of a Markdown tilasm by its text, as a reader sees it, never by an offset: an edit
// elsewhere leaves it in place, and two identical sentences stay apart by what surrounds them.
//
// The text is the document's rendered text: the Markdown without its markup (no #, *, `, link targets, list markers,
// table pipes, images, raw HTML), its blocks (paragraphs, headings, list items' paragraphs, table cells, code blocks)
// in order, every run of white space, a block's end included, one space. Djinn compares anchors in that form, so a
// line break, a hard break or an empty paragraph between two blocks counts as one space.
message TilasmAnchor {
  // The passage itself, in that text. Empty: a place to insert at, between prefix and suffix.
  string quote = 1 [(buf.validate.field).string.max_len = 100000];
  // The text just before it, some 32 characters; empty at the document's start.
  string prefix = 2 [(buf.validate.field).string.max_len = 1000];
  // The text just after it, some 32 characters; empty at the document's end.
  string suffix = 3 [(buf.validate.field).string.max_len = 1000];
  // The tilasm's revision it was taken at.
  int64 revision = 4;
}

// TilasmAnchorState is where an anchor stands in the tilasm's latest text. Djinn computes it at each read, never
// stores it.
enum TilasmAnchorState {
  // Not computed: the record as stored.
  TILASM_ANCHOR_STATE_UNSPECIFIED = 0;
  // The passage is there, once, unchanged.
  TILASM_ANCHOR_STATE_ANCHORED = 1;
  // What surrounds it still points to one place, but its text changed there: a proposal can no longer be accepted.
  TILASM_ANCHOR_STATE_CHANGED = 2;
  // The passage is gone: deleted, or rewritten beyond recognition.
  TILASM_ANCHOR_STATE_MISSING = 3;
  // The passage is there several times, and what surrounds it does not say which.
  TILASM_ANCHOR_STATE_AMBIGUOUS = 4;
}

// TilasmMessage is a message of a discussion.
message TilasmMessage {
  // Identifier, a UUIDv7.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Who wrote it: the developer, the lead, the tilasm's document agent (document), a task's code (W12).
  string author = 2 [(buf.validate.field).string.max_len = 100];
  // Its text, in Markdown.
  string text = 3 [(buf.validate.field).string.max_len = 20000];
  // When it was written.
  google.protobuf.Timestamp create_time = 4;
  // The request that wrote it: the same request again returns it rather than writing it twice.
  string request_id = 5 [(buf.validate.field).string.max_len = 200];
}

// TilasmThread is a discussion on a passage of a Markdown tilasm. It never changes the document: a change is a
// proposal, which the developer accepts or rejects.
message TilasmThread {
  // Identifier, a UUIDv7.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Wish of its tilasm.
  string wish_id = 2;
  // The tilasm discussed.
  string tilasm_id = 3;
  // The passage discussed.
  TilasmAnchor anchor = 4;
  // Its messages, the first first.
  repeated TilasmMessage messages = 5;
  // Closed by the developer: kept, shown apart.
  bool resolved = 6;
  // When it was opened.
  google.protobuf.Timestamp create_time = 7;
  // When it last changed: a message, or its resolution.
  google.protobuf.Timestamp update_time = 8;
  // The request that opened it: the same request again returns it rather than opening another.
  string request_id = 9 [(buf.validate.field).string.max_len = 200];
  // Where its anchor stands in the latest text; computed at each read.
  TilasmAnchorState anchor_state = 10;
  // The rendered text at its place now, when the anchor is anchored or changed; computed at each read.
  string current = 11;
  // What it was opened for: a discussion, or a request for a change. Unspecified reads as a comment.
  TilasmThreadKind kind = 12;
  // The document agent works on it now: its last message is the developer's, and the tilasm's document agent is
  // planned or running. Computed at each read of the discussions, never stored.
  bool agent_pending = 13;
}

// TilasmThreadKind is what the developer opens a discussion for. Each message the developer writes in a discussion
// wakes the tilasm's document agent, which answers in it.
enum TilasmThreadKind {
  // Not set: read as a comment.
  TILASM_THREAD_KIND_UNSPECIFIED = 0;
  // A discussion on the passage: the agent replies, and proposes a change only when the discussion calls for one.
  TILASM_THREAD_KIND_COMMENT = 1;
  // A request for a change at the passage, or at a place with an empty quote: the agent answers with a proposal
  // linked to the discussion, and a short message if needed.
  TILASM_THREAD_KIND_REQUEST = 2;
}

// TilasmProposalStatus is where a proposal stands.
enum TilasmProposalStatus {
  // Not set.
  TILASM_PROPOSAL_STATUS_UNSPECIFIED = 0;
  // Waiting for the developer.
  TILASM_PROPOSAL_STATUS_PENDING = 1;
  // Accepted: the document holds it.
  TILASM_PROPOSAL_STATUS_ACCEPTED = 2;
  // Rejected: the document never held it.
  TILASM_PROPOSAL_STATUS_REJECTED = 3;
}

// TilasmProposal is a change to a passage of a Markdown tilasm, waiting for the developer: the document holds it only
// once accepted, which Djinn does, never an agent.
message TilasmProposal {
  // Identifier, a UUIDv7.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Wish of its tilasm.
  string wish_id = 2;
  // The tilasm it changes.
  string tilasm_id = 3;
  // The discussion it answers, if any.
  string thread_id = 4;
  // The passage it replaces, or with an empty quote the place it inserts at.
  TilasmAnchor anchor = 5;
  // The Markdown that replaces the passage's source, markup included; empty: the passage is deleted.
  string replacement = 6 [(buf.validate.field).string.max_len = 52428800];
  // Who proposes it: the lead, the tilasm's document agent (document), a task's code (W12).
  string author = 7 [(buf.validate.field).string.max_len = 100];
  // Why, in a few words.
  string note = 8 [(buf.validate.field).string.max_len = 20000];
  // Where it stands.
  TilasmProposalStatus status = 9;
  // Who accepted or rejected it.
  string decided_by = 10 [(buf.validate.field).string.max_len = 100];
  // When it was accepted or rejected.
  google.protobuf.Timestamp decide_time = 11;
  // The tilasm's revision it was proposed on.
  int64 base_revision = 12;
  // The tilasm's revision its acceptance wrote.
  int64 accepted_revision = 13;
  // When it was proposed.
  google.protobuf.Timestamp create_time = 14;
  // The request that proposed it: the same request again returns it rather than proposing it twice.
  string request_id = 15 [(buf.validate.field).string.max_len = 200];
  // Where its anchor stands in the latest text; computed at each read.
  TilasmAnchorState anchor_state = 16;
  // The Markdown source it would replace now, markup included, when its anchor is anchored or changed; computed at
  // each read.
  string original = 17;
  // The rendered text at its place now, when its anchor is anchored or changed; computed at each read.
  string current = 18;
}

// TilasmFile is a file of a tilasm's version.
message TilasmFile {
  // The version it belongs to.
  int32 version = 1;
  // Its path in the version's folder, with forward slashes: index.html, img/model.svg.
  string path = 2;
  // Its content.
  bytes content = 3;
}

// Tilasms, or talismans: the material that explains a wish, kept on this machine and linked from anywhere. A put
// replaces a tilasm with a new version, and the earlier ones can be read and restored.
service TilasmService {
  option (djinn.v1.alias) = "talisman";
  option (djinn.v1.alias) = "doc";

  // Put a Markdown document, a .md file or a folder with an index.md, as a tilasm of the wish; or, for an HTML page
  // the developer asked for, a folder that holds an index.html, or a .zip of one. A new one, or with --code a new
  // version of that one, its links unchanged.
  rpc Put(TilasmServicePutRequest) returns (TilasmServicePutResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // List the tilasms, of a wish or of all; --search keeps those whose code, title or text holds every word.
  rpc List(TilasmServiceListRequest) returns (TilasmServiceListResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Read a tilasm: its manifest, the text of its index.html without the tags, and the folder of its files.
  rpc Get(TilasmServiceGetRequest) returns (TilasmServiceGetResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Show a tilasm in the window, in its wish's Tilasms tab, starting Djinn when it does not run: what its link
  // djinn://tilasm/<id> does from anywhere.
  rpc Open(TilasmServiceOpenRequest) returns (TilasmServiceOpenResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
    option (djinn.v1.autostart) = true;
  }
  // The versions of a tilasm, the first first, with their folders.
  rpc History(TilasmServiceHistoryRequest) returns (TilasmServiceHistoryResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Restore an earlier version: it comes back as a new version, and the others stay.
  rpc Restore(TilasmServiceRestoreRequest) returns (TilasmServiceRestoreResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Export a tilasm as a .zip: the files of its latest version, and its manifest, tilasm.json.
  rpc Export(TilasmServiceExportRequest) returns (TilasmServiceExportResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_DELETE;
  }
  // Import a tilasm's .zip into a wish: a new version of the same tilasm when the wish has it, else a new tilasm.
  rpc Import(TilasmServiceImportRequest) returns (TilasmServiceImportResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Put the files the window read, dropped on the Tilasms tab: a folder's files, a .md file, or a .zip. A .zip that
  // djinn tilasm export wrote is imported, as Import; any other is put, as Put.
  rpc PutData(TilasmServicePutDataRequest) returns (TilasmServicePutDataResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Create a Markdown document as a tilasm of the wish, from its title and, if given, its text.
  rpc Create(TilasmServiceCreateRequest) returns (TilasmServiceCreateResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Save the text of a Markdown tilasm, edited in the window, from the revision the editor started from. Refused with
  // ABORTED when the tilasm has moved on since: the window reads it again. A save by the latest version's author,
  // within minutes of it, rewrites that version; any other adds one.
  rpc Save(TilasmServiceSaveRequest) returns (TilasmServiceSaveResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Open a discussion on a passage of a Markdown tilasm: --quote names it, as the document reads, without its markup.
  // When the quote is in the document several times, --prefix or --suffix (the text just before or after it) say
  // which. A discussion never changes the document: propose a change for that.
  rpc Comment(TilasmServiceCommentRequest) returns (TilasmServiceCommentResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Reply in a discussion.
  rpc Reply(TilasmServiceReplyRequest) returns (TilasmServiceReplyResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Close a discussion, or open it again: the developer's, in the window.
  rpc Resolve(TilasmServiceResolveRequest) returns (TilasmServiceResolveResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Ask the document agent again to answer a discussion whose last message is the developer's, as if they had just
  // written it: no message is added. The developer's, in the window.
  rpc Wake(TilasmServiceWakeRequest) returns (TilasmServiceWakeResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Propose a change to a passage of a Markdown tilasm, rather than rewriting a document the developer edits: the
  // passage by --quote, or the passage of a discussion by --thread; its new Markdown by --replacement or
  // --replacement-file, or --delete. With an empty quote and --prefix or --suffix, it inserts there. The document
  // changes only once the developer accepts it.
  rpc Propose(TilasmServiceProposeRequest) returns (TilasmServiceProposeResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Accept a proposal: Djinn writes it into the document, as a new revision, when its passage is there unchanged;
  // refused with FAILED_PRECONDITION when the passage changed, is gone or is ambiguous. The developer's, in the window:
  // an agent never accepts.
  rpc Accept(TilasmServiceAcceptRequest) returns (TilasmServiceAcceptResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // Reject a proposal: the document never holds it. The developer's, in the window.
  rpc Reject(TilasmServiceRejectRequest) returns (TilasmServiceRejectResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
    option (djinn.v1.writes) = WRITES_CHANGE;
  }
  // The discussions and proposals of a Markdown tilasm, in the order of the document, each with where its passage
  // stands in the latest text.
  rpc Discussions(TilasmServiceDiscussionsRequest) returns (TilasmServiceDiscussionsResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // What an agent needs to answer on a passage: the document's Markdown (a window around the passage when it is too
  // large), the passage and its paragraphs, the discussion's messages and its proposals. The passage by --thread,
  // --proposal or --quote.
  rpc Context(TilasmServiceContextRequest) returns (TilasmServiceContextResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message TilasmServicePutRequest {
  // The .md file, or the folder that holds the index.md, or for an HTML page the index.html, or a .zip of it; a
  // relative path starts from the current directory.
  string path = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 4096
  ];
  // The wish it explains.
  string wish = 2 [(buf.validate.field).string.uuid = true];
  // Title, in a line; by default the first heading of its Markdown, or the <title> of its index.html, or the file's
  // or folder's name. A new version keeps the title it had unless one is given.
  string title = 3 [(buf.validate.field).string.max_len = 1000];
  // The tilasm to put again, by its code (L01): a new version of it. Without it, a new tilasm with the next code.
  string code = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^[Ll][0-9]{2,3}$"
  ];
  // An azima or a task of the wish it explains, by code (T29, W12) or identifier; repeat it for each. A new version
  // keeps what it cited unless some are given.
  repeated string cites = 5 [
    (buf.validate.field).repeated.max_items = 100,
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.max_len = 64
  ];
  // Who makes it: your task's code (W12) for a worker; lead by default.
  string author = 6 [(buf.validate.field).string.max_len = 100];
}

message TilasmServicePutResponse {
  // The tilasm, its new version last.
  Tilasm tilasm = 1;
  // The folder of the version put.
  string directory = 2;
}

message TilasmServiceListRequest {
  // Only the tilasms of this wish.
  string wish = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // Words to find, case ignored, in the code, the title or the text of the latest version; "talisman" or "tilasm"
  // alone finds them all.
  string search = 2 [(buf.validate.field).string.max_len = 1000];
}

message TilasmServiceListResponse {
  // The tilasms, by wish then code.
  repeated Tilasm tilasms = 1;
}

message TilasmServiceGetRequest {
  // The tilasm: its code (L01) or its identifier.
  TilasmRef tilasm = 1 [(buf.validate.field).required = true];
  // The wish, when a code is given and several wishes have it.
  string wish = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // An earlier version to read; by default the latest.
  int32 version = 3 [(buf.validate.field).int32.gte = 0];
}

message TilasmServiceGetResponse {
  // The tilasm.
  Tilasm tilasm = 1;
  // The version read.
  int32 version = 2;
  // The Markdown of a Markdown tilasm; the text of an HTML page's index.html, without tags, scripts nor styles.
  string text = 3;
  // The folder of the version's files.
  string directory = 4;
  // Its files, relative to that folder, with forward slashes.
  repeated string files = 5;
  // Its link, djinn://tilasm/<id>: it opens the tilasm in the app from a browser, a chat, a terminal or a Markdown
  // file. Cite it so.
  string link = 6;
  // The local http address of its latest version, for a browser or an agent that wants the HTML, while this Djinn
  // runs: given when djinn up serves http (--browser, and on Windows). Empty while it listens on a socket only (the
  // window on macOS and Linux): read the files in its folder then.
  string url = 7;
}

message TilasmServiceOpenRequest {
  // The tilasm: its code (L01) or its identifier.
  TilasmRef tilasm = 1 [(buf.validate.field).required = true];
  // The wish, when a code is given and several wishes have it.
  string wish = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message TilasmServiceOpenResponse {
  // The tilasm shown.
  Tilasm tilasm = 1;
  // Its link, djinn://tilasm/<id>.
  string link = 2;
  // A native window was brought to the front; false in browser mode, where the page shows it.
  bool window = 3;
}

message TilasmServiceHistoryRequest {
  // The tilasm: its code (L01) or its identifier.
  TilasmRef tilasm = 1 [(buf.validate.field).required = true];
  // The wish, when a code is given and several wishes have it.
  string wish = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message TilasmServiceHistoryResponse {
  // The versions, the first first.
  repeated TilasmVersion versions = 1;
  // The tilasm's folder: version n is in its folder v<n>.
  string directory = 2;
}

message TilasmServiceRestoreRequest {
  // The tilasm: its code (L01) or its identifier.
  TilasmRef tilasm = 1 [(buf.validate.field).required = true];
  // The version to restore.
  int32 version = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32.gte = 1
  ];
  // The wish, when a code is given and several wishes have it.
  string wish = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // Who restores it; lead by default.
  string author = 4 [(buf.validate.field).string.max_len = 100];
}

message TilasmServiceRestoreResponse {
  // The tilasm, the restored version last.
  Tilasm tilasm = 1;
}

message TilasmServiceExportRequest {
  // The tilasm: its code (L01) or its identifier.
  TilasmRef tilasm = 1 [(buf.validate.field).required = true];
