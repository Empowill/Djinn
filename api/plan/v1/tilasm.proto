  string id = 1 [(buf.validate.field).string.uuid = true];
  // The tilasm's revision the text was edited from.
  int64 base_revision = 2 [(buf.validate.field).int64.gte = 0];
  // Its whole text, in Markdown.
  string markdown = 3 [(buf.validate.field).string.max_len = 52428800];
  // A new title, in a line; empty keeps it.
  string title = 4 [(buf.validate.field).string.max_len = 1000];
  // Who saves it; the developer by default.
  string author = 5 [(buf.validate.field).string.max_len = 100];
}

message TilasmServiceSaveResponse {
  // The tilasm, at its new revision, the version saved last.
  Tilasm tilasm = 1;
}

message TilasmServiceCommentRequest {
  // The tilasm: its code (L01) or its identifier.
  TilasmRef tilasm = 1 [(buf.validate.field).required = true];
  // The wish, when a code is given and several wishes have it.
  string wish = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // The passage discussed, as the document reads, without its markup; empty with --prefix or --suffix for a place.
  string quote = 3 [(buf.validate.field).string.max_len = 100000];
  // The text just before the passage, when the quote alone does not say which.
  string prefix = 4 [(buf.validate.field).string.max_len = 1000];
  // The text just after the passage, when the quote alone does not say which.
  string suffix = 5 [(buf.validate.field).string.max_len = 1000];
  // The message, in Markdown.
  string text = 6 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 20000
  ];
  // Who writes it: your task's code (W12) for a worker; by default $DJINN_AUTHOR, which Djinn sets to document for a
  // document agent; lead otherwise.
  string author = 7 [
    (buf.validate.field).string.max_len = 100,
    (djinn.v1.env) = "DJINN_AUTHOR"
  ];
  // An identifier of your own for this request: sent again, after an interruption, it returns the discussion opened
  // the first time rather than opening another.
  string request_id = 8 [(buf.validate.field).string.max_len = 200];
  // What the discussion is for: a comment, the default, or a request for a change, which the document agent answers
  // with a proposal.
  TilasmThreadKind kind = 9 [(buf.validate.field).enum.defined_only = true];
  // --text is written on one line with escapes: \n is a line break, \t a tab, \\ a backslash, and any other
  // backslash escape is refused. Without it, the text is taken as written.
  bool escapes = 10;
}

message TilasmServiceCommentResponse {
  // The discussion.
  TilasmThread thread = 1;
}

message TilasmServiceReplyRequest {
  // The discussion, by its identifier.
  string thread = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // The message, in Markdown.
  string text = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 20000
  ];
  // Who writes it: your task's code (W12) for a worker; by default $DJINN_AUTHOR, which Djinn sets to document for a
  // document agent; lead otherwise.
  string author = 3 [
    (buf.validate.field).string.max_len = 100,
    (djinn.v1.env) = "DJINN_AUTHOR"
  ];
  // An identifier of your own for this request: sent again, it returns the discussion with the message written the
  // first time rather than writing it twice.
  string request_id = 4 [(buf.validate.field).string.max_len = 200];
  // --text is written on one line with escapes: \n is a line break, \t a tab, \\ a backslash, and any other
  // backslash escape is refused. Without it, the text is taken as written.
  bool escapes = 5;
}

message TilasmServiceReplyResponse {
