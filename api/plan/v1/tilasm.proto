message TilasmServiceCreateRequest {
  // The wish it explains.
  string wish = 1 [(buf.validate.field).string.uuid = true];
  // Title, in a line; by default the first heading of its text.
  string title = 2 [
    (buf.validate.field).string.max_len = 1000,
    (djinn.v1.positional) = true
  ];
  // Its text, in Markdown; empty for a document to write.
  string markdown = 3 [(buf.validate.field).string.max_len = 52428800];
  // An azima or a task of the wish it explains, by code (T29, W12) or identifier; repeat it for each.
  repeated string cites = 4 [
    (buf.validate.field).repeated.max_items = 100,
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.max_len = 64
  ];
  // Who makes it: your task's code (W12) for a worker; lead by default.
  string author = 5 [(buf.validate.field).string.max_len = 100];
}

message TilasmServiceCreateResponse {
  // The tilasm, at its first version and revision.
  Tilasm tilasm = 1;
  // The folder of its first version.
  string directory = 2;
}

message TilasmServiceSaveRequest {
