message TilasmServiceProposeRequest {
  // The tilasm: its code (L01) or its identifier.
  TilasmRef tilasm = 1 [(buf.validate.field).required = true];
  // The wish, when a code is given and several wishes have it.
  string wish = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // The discussion it answers: its passage, unless --quote names another.
  string thread = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // The passage to replace, as the document reads, without its markup; empty with --prefix or --suffix to insert there.
  string quote = 4 [(buf.validate.field).string.max_len = 100000];
  // The text just before the passage, when the quote alone does not say which.
  string prefix = 5 [(buf.validate.field).string.max_len = 1000];
  // The text just after the passage, when the quote alone does not say which.
  string suffix = 6 [(buf.validate.field).string.max_len = 1000];
  // The Markdown that replaces the passage's source, markup included (djinn doc context shows that source).
  string replacement = 7 [(buf.validate.field).string.max_len = 52428800];
  // A file that holds the replacement, instead of --replacement; a relative path starts from the current directory.
  string replacement_file = 8 [(buf.validate.field).string.max_len = 4096];
  // The passage is to be deleted: no replacement.
  bool delete = 9;
  // Why, in a few words, for the developer.
  string note = 10 [(buf.validate.field).string.max_len = 20000];
  // Who proposes it: your task's code (W12) for a worker; by default $DJINN_AUTHOR, which Djinn sets to document for
  // a document agent; lead otherwise.
  string author = 11 [
    (buf.validate.field).string.max_len = 100,
    (djinn.v1.env) = "DJINN_AUTHOR"
  ];
  // An identifier of your own for this request: sent again, it returns the proposal made the first time rather than
  // proposing it twice.
  string request_id = 12 [(buf.validate.field).string.max_len = 200];
  // --replacement and --note are written on one line with escapes: \n is a line break, \t a tab, \\ a
  // backslash, and any other backslash escape is refused. Without it, they are taken as written.
  bool escapes = 13;
}

message TilasmServiceProposeResponse {
  // The proposal, pending.
  TilasmProposal proposal = 1;
}

