syntax = "proto3";

// The interface reserved to the native window. Agents never call it.
package ui.v1;

import "buf/validate/validate.proto";
import "djinn/v1/load.proto";
import "djinn/v1/options.proto";

// What the window needs to show and follow the plan.
service UiService {
  // The environment the window runs in.
  rpc GetEnvironment(UiServiceGetEnvironmentRequest) returns (UiServiceGetEnvironmentResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
  }
  // Ask the user for a folder with the system's dialog, over the window. Only the native window has one: see
  // UiServiceGetEnvironmentResponse.folder_dialog. An empty directory says the user cancelled.
  rpc ChooseDirectory(UiServiceChooseDirectoryRequest) returns (UiServiceChooseDirectoryResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
  }
  // Open an HTTP or HTTPS link in the default browser.
  rpc OpenExternal(UiServiceOpenExternalRequest) returns (UiServiceOpenExternalResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
  }
  // Choose the global shortcut that brings the window forward from anywhere on the desktop; an empty chord turns it
  // off. Kept in the data directory. Fails on a chord Djinn does not take; one the system refuses (another
  // application holds it) is kept, and its problem said.
  rpc SetShortcut(UiServiceSetShortcutRequest) returns (UiServiceSetShortcutResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
  }
  // Bring the window to the front: restored if minimised, raised and focused. With a wish or a terminal, the
  // window shows them too. In browser mode, djinn up prints the address of the page again.
  rpc Show(UiServiceShowRequest) returns (UiServiceShowResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
  }
  // Open a djinn:// link in the window, as the system does when one is clicked anywhere (djinn open): djinn://tilasm/<id>
  // shows its wish's Tilasms tab on that tilasm, djinn://wish/<id> the wish. A link Djinn does not know, or a tilasm or
  // a wish not on this machine, is refused, saying so; the window says so too.
  rpc OpenLink(UiServiceOpenLinkRequest) returns (UiServiceOpenLinkResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
  }
  // What the window is asked to show, as it comes. A request of the last minute comes first, for a window that
  // opens after it.
  rpc WatchShow(UiServiceWatchShowRequest) returns (stream UiServiceWatchShowResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
  }
  // Whether a newer Djinn waits at the path of the running one, as it changes: the current answer first, then each
  // change. With the leads that a restart could not resume, once, and the last build pushed of each integration branch
  // that is not installed.
  rpc WatchUpdate(UiServiceWatchUpdateRequest) returns (stream UiServiceWatchUpdateResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
  }
  // What the window is asked to show and whether a newer Djinn waits, in a single stream.
  rpc Watch(UiServiceWatchRequest) returns (stream UiServiceWatchResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
  }
  // Restart on the newer Djinn that waits at the path of the running one: the open terminals are noted, Djinn stops
  // as when it quits (workers interrupted, nothing lost), then the new one starts and runs them again on the same
  // sessions. Fails when no newer Djinn waits. With a build, its install command runs first, within a deadline, its
  // steps and its failure told by WatchUpdate (Installing) whether or not the call's answer arrives; when it installed
  // no newer Djinn, nothing restarts. The install runs on even when the call ends first. Only the update button and
  // `djinn update` call it.
  rpc Update(UiServiceUpdateRequest) returns (UiServiceUpdateResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
  }
  // Whether the system lets Djinn show notifications.
  rpc GetNotifications(UiServiceGetNotificationsRequest) returns (UiServiceGetNotificationsResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
  }
  // Ask the system to let Djinn show notifications: on macOS, its dialog the first time; then the answer it keeps.
  // Returns once the user answered.
  rpc RequestNotifications(UiServiceRequestNotificationsRequest) returns (UiServiceRequestNotificationsResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
  }
  // Open the system's notification settings, on Djinn where the system can: see
  // UiServiceGetNotificationsResponse.settings.
  rpc OpenNotificationSettings(UiServiceOpenNotificationSettingsRequest) returns (UiServiceOpenNotificationSettingsResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
  }
  // Say which wish the page shows: no notification comes for it while the window is in front.
  rpc View(UiServiceViewRequest) returns (UiServiceViewResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
  }
  // Say that the developer is there: a key, a click or a scroll in the window in front, sent at most every 30 seconds.
  // It keeps the ifrits lit.
  rpc Touch(UiServiceTouchRequest) returns (UiServiceTouchResponse) {
    option (djinn.v1.visibility) = VISIBILITY_INTERNAL;
  }
}

message UiServiceGetEnvironmentRequest {
  // Check the agent command lines too: whether each is installed, its version, and whether it is signed in. Takes up
  // to a few seconds; without it, providers is empty.
  bool agents = 1;
}

message UiServiceGetEnvironmentResponse {
  // Version of djinn.
  string version = 1;
  // Operating system, with the names Node.js uses: linux, darwin, win32.
  string platform = 2;
  // The agent command lines Djinn knows, and where each stands; empty unless the request asks for the agents.
  repeated Provider providers = 3;
  // The window can open the system's folder dialog: ChooseDirectory works. False in the browser.
  bool folder_dialog = 4;
  // The global shortcut that brings the window forward.
  Shortcut shortcut = 5;
}

// The global shortcut that brings the window forward from anywhere on the desktop, on the wish with the newest open
// question, else on the flying carpet.
message Shortcut {
  // The chord in effect, such as Ctrl+Alt+Space; empty when off.
  string chord = 1;
  // The chord used until one is chosen.
  string default_chord = 2;
  // This Djinn can take a global shortcut: a native window on a system that has them. False in the browser.
  bool available = 3;
  // Why the chord does not work, as the system said, such as another application holding it; empty when it works or
  // is off.
  string problem = 4;
}

// The window's settings that Djinn acts on, in settings.json of the data directory. The page keeps its own (the
// language, the theme).
message Settings {
  // The global shortcut's chord. Unset: the default one. Empty: off.
  optional string shortcut = 1;
  // The operating load notch in effect on this machine. Unset: default (medium).
  optional djinn.v1.LoadNotch load = 2;
  // Minutes without you in Djinn before Djinn puts an ifrit out, 5 to 240: your pace on this machine. Unset: 30.
  // djinn up --ifrit-idle, and an ifrit's own (djinn task spawn --idle-minutes), come first.
  optional uint32 ifrit_idle_minutes = 3 [(buf.validate.field).uint32 = {
    gte: 5
    lte: 240
  }];
}

// An agent command line. Djinn looks for it on its PATH, the PATH of the user's login shell, and the folders its
// installers use, so that a window started from the Finder finds it too.
message Provider {
  // Identifier: claude, codex or antigravity.
  string id = 1;
  // Name shown in the window.
  string name = 2;
  // The command is found on this machine.
  bool available = 3;
  // The command, as resolved when available: claude, codex, agy.
  string command = 4;
  // Where the agent stands.
  ProviderState state = 5;
  // The version the command reports; empty when it is not installed, or when Djinn does not know how to ask.
  string version = 6;
  // The command line that installs the agent, from its official documentation, for this platform.
  string install_command = 7;
  // The command line that signs the agent in, from its official documentation.
  string login_command = 8;
}

// ProviderState is whether an agent command line is installed and signed in.
enum ProviderState {
  // Not set.
  PROVIDER_STATE_UNSPECIFIED = 0;
  // The command is not found.
  PROVIDER_STATE_MISSING = 1;
  // Installed, not signed in: its status command says so.
  PROVIDER_STATE_SIGNED_OUT = 2;
  // Installed and signed in: its status command says so.
  PROVIDER_STATE_READY = 3;
  // Installed; whether it is signed in is unknown: the agent has no status command, or it failed or took too long.
  PROVIDER_STATE_UNKNOWN = 4;
}

message UiServiceChooseDirectoryRequest {
  // Title of the dialog.
  string title = 1 [(buf.validate.field).string.max_len = 200];
  // Folder the dialog opens in; the home folder when empty or not a folder.
  string directory = 2 [(buf.validate.field).string.max_len = 4096];
}

message UiServiceChooseDirectoryResponse {
  // Absolute path of the folder chosen; empty when the user cancelled.
  string directory = 1;
}

message UiServiceOpenExternalRequest {
  // The link, http or https only.
  string url = 1;
}

message UiServiceOpenExternalResponse {
  // The link as opened.
  string url = 1;
}

message UiServiceSetShortcutRequest {
  // The chord: modifiers then a key, joined by +, such as Ctrl+Alt+Space. Empty turns the shortcut off.
  string chord = 1 [(buf.validate.field).string.max_len = 64];
}

message UiServiceSetShortcutResponse {
  // The shortcut as it now is.
  Shortcut shortcut = 1;
}

message UiServiceShowRequest {
  // A wish to show, if any.
  string wish_id = 1;
  // A terminal to show at the bottom of the window, by name, if any.
  string terminal = 2 [(buf.validate.field).string.max_len = 64];
}

message UiServiceShowResponse {
  // A native window was brought to the front; false in browser mode.
  bool window = 1;
}

message UiServiceOpenLinkRequest {
  // The link: djinn://tilasm/<id> or djinn://wish/<id>.
  string url = 1 [(buf.validate.field).string.max_len = 4096];
}

message UiServiceOpenLinkResponse {
  // The wish shown.
  string wish_id = 1;
  // The tilasm shown in its Tilasms tab; empty for a wish's link.
  string tilasm_id = 2;
  // A native window was brought to the front; false in browser mode.
  bool window = 3;
}

message UiServiceWatchShowRequest {}

message UiServiceWatchShowResponse {
  // The wish to show; empty for none.
  string wish_id = 1;
  // The terminal to show; empty for none.
  string terminal = 2;
  // The tilasm to show, in the wish's Tilasms tab; empty for none.
  string tilasm_id = 3;
  // A link the window was asked to open and Djinn does not know, or whose tilasm or wish is not on this machine: the
  // window says so. Empty for none.
  string unknown_link = 4;
  // The element of the wish to bring into view, by its id in the page: question-<id>, task-<id>, grant-<wish id>;
  // empty for the top of the wish.
  string target = 5;
}

message UiServiceWatchUpdateRequest {}

message UiServiceWatchUpdateResponse {
  // Version of the running Djinn.
  string current = 1;
  // Version of the newer Djinn installed at the same path; empty when none waits.
  string ready = 2;
  // The terminals the last restart could not run again, one line each: name, command, folder and why.
  repeated string not_resumed = 3;
  // Where the release notes of the newer Djinn are, an http(s) link; empty when none waits, or when it comes from a
  // local install, which has none.
  string notes_url = 4;
  reserved 5;
  reserved "build";
  // The last push of each integration branch, in a project whose settings name an install command, and not installed
  // since: one per branch, the branch the running Djinn was built from first, then those that carry its line on
  // (Build.continues). The window proposes to install each and restart on it, the other branches' folded.
  repeated Build builds = 7;
  // The install of a build that runs now (Update), and where it stands; unset for none. The window says it in place
  // of the build's buttons: what it waits for, then that it builds, then that Djinn restarts.
  Installing installing = 6;
  // The newer Djinn of version ready, named as a build is: its commit, the branch and wish it comes from, and how it
  // compares with the running Djinn. Unset when no project holds its commit (a release no checkout knows yet).
  Build ready_build = 8;
  // The newer Djinn of version ready is at the path of the running one already: Update only restarts on it. False for
  // a release found, which Update downloads first.
  bool installed = 9;
}

message UiServiceWatchRequest {}

message UiServiceWatchResponse {
  // A request to show something in the window, if any.
  UiServiceWatchShowResponse show = 1;
  // A change in the update state, if any.
  UiServiceWatchUpdateResponse update = 2;
  // A change in the operating load, if any.
  djinn.v1.LoadServiceWatchResponse load = 3;
}

// Installing is an install of a build that runs now, and where it stands; or the last one, when it failed.
message Installing {
  // The commit being installed.
  string sha = 1;
  InstallStep step = 2;
  // What it waits for, while its step is waiting: another install, a gate and who holds it, the machine under
  // pressure. Empty otherwise.
  string waiting = 3;
  // The step of the install command that runs, as its output names it: go-task's "task: [ui] npm run build" is
  // "ui: npm run build". Empty before the first, and for a command that names none.
  string doing = 4;
  // Djinn installs it by itself: a build of the running Djinn's line (Build.auto).
  bool auto = 5;
  // Why it failed (INSTALL_STEP_FAILED): its command's exit, or the deadline it passed.
  string error = 6;
  // The last lines its command wrote, when it failed.
  repeated string log = 7;
}

// InstallStep is where an install stands.
enum InstallStep {
  INSTALL_STEP_UNSPECIFIED = 0;
  // It waits for its turn: Installing.waiting says for what.
  INSTALL_STEP_WAITING = 1;
  // It checks the build out in a worktree of its own, and sets that worktree up when the project's lock files changed.
  INSTALL_STEP_PREPARING = 2;
  // It runs the project's install command.
  INSTALL_STEP_BUILDING = 3;
  // Installed: Djinn restarts on it.
  INSTALL_STEP_RESTARTING = 4;
  // It failed, or passed its deadline and Djinn stopped it: Installing.error says why, Installing.log what its command
  // wrote last. Kept until another install starts, or the build is proposed no more.
  INSTALL_STEP_FAILED = 5;
}

// TaskSummary is what a task of the build brought, and its worker's final words.
message TaskSummary {
  // The task's code: W5.
  string code = 1;
  // The task's title.
  string title = 2;
  // The worker's summary: the last words of its run.
  string summary = 3;
}

// Build is a wish's integration branch as Djinn pushed it (T07), to install.
message Build {
  // The wish, and its title.
  string wish_id = 1;
  string wish_title = 2;
  // The project, by its identifier and its name.
  string project_id = 3;
  string project = 4;
  // The integration branch, and the commit pushed.
  string branch = 5;
  string sha = 6;
  // The tasks whose work the push brought, by code: W5.
  repeated string tasks = 7;
  // The titles of the commits the push brought, the latest first.
  repeated string changes = 8;
  // What changed, one per task: its code and title, and its worker's summary.
  repeated TaskSummary summaries = 9;
  // The command that installs it: go tool task install.
  string install = 10;
  // The commit of the running Djinn it is compared with, when a project holds it: tasks, summaries and changes are
  // then what the build adds to it, and lacks what it lacks. Empty: they are what the push brought.
  string base = 11;
  // The running Djinn was built from this branch: its build comes first.
  bool running = 12;
  // How many commits, merges aside, the build adds to the running Djinn; changes holds the latest of them.
  int32 changes_count = 13;
  // The titles of the commits the running Djinn holds and the build does not, the latest first, and how many there
  // are: the build is older than the running Djinn on them.
  repeated string lacks = 14;
  int32 lacks_count = 15;
  // The line of the running Djinn this build carries on from another branch: its commit holds the running Djinn's,
  // as when a wish moves its integration branch to one cut at the tip of the running one (W527). It names the
  // branch the running Djinn was built from, or its short commit when no branch names it. Empty for a build of that
  // branch itself (running), and for one that does not hold the running commit: a parallel branch.
  string continues = 16;
  // Djinn installs it by itself, at low priority, once no gate runs and the machine is not under pressure (W554): a
  // build of the running Djinn's line (running or continues), the push checks passed, in a project whose
  // install_builds is on, that holds the build installed last. The window then offers the restart. Other builds are
  // only offered.
  bool auto = 17;
}

message UiServiceUpdateRequest {
  // The commit of the build to install first, as WatchUpdate proposed it; empty to restart on the newer Djinn
  // already installed. Refused when it is none of the builds proposed.
  string build = 1 [(buf.validate.field).string.max_len = 64];
}

message UiServiceUpdateResponse {
  // Version Djinn restarts on; empty when the build installed no newer Djinn: nothing restarts.
  string version = 1;
  // How many terminals the new Djinn will run again.
  int32 terminals = 2;
  // The commit of the build installed, when one was.
  string installed = 3;
}

// Whether the system lets Djinn show notifications.
enum NotificationAccess {
  // Not known yet: the window is starting.
  NOTIFICATION_ACCESS_UNSPECIFIED = 0;
  // This Djinn cannot show any: the browser, a build without a window, a system without notifications, or on macOS
  // a Djinn that does not run from its app.
  NOTIFICATION_ACCESS_UNAVAILABLE = 1;
  // The system shows them.
  NOTIFICATION_ACCESS_ALLOWED = 2;
  // The system does not show them: not allowed yet, or turned off in its settings.
  NOTIFICATION_ACCESS_DENIED = 3;
}

message UiServiceGetNotificationsRequest {}

message UiServiceGetNotificationsResponse {
  NotificationAccess access = 1;
  // OpenNotificationSettings opens the system's settings (macOS).
  bool settings = 2;
}

message UiServiceRequestNotificationsRequest {}

message UiServiceRequestNotificationsResponse {
  NotificationAccess access = 1;
  // OpenNotificationSettings opens the system's settings (macOS).
  bool settings = 2;
}

message UiServiceOpenNotificationSettingsRequest {}

message UiServiceOpenNotificationSettingsResponse {}

message UiServiceViewRequest {
  // The wish the page shows; empty for none (the flying carpet, a dialog of its own).
  string wish_id = 1 [(buf.validate.field).string.max_len = 64];
}

message UiServiceViewResponse {}

message UiServiceTouchRequest {}

message UiServiceTouchResponse {}
