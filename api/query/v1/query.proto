syntax = "proto3";

// Package query.v1 reads Djinn's stored collections as tables: one route for every list, its columns, filters,
// sorts and aggregates named by refs, its answer an Arrow table whose shape follows the query.
package query.v1;

import "buf/validate/validate.proto";
import "djinn/v1/options.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// QueryService reads a collection of Djinn's data as a table. A ref names a column: a field by its path (code,
// usage.cost_usd), across a field that holds another entity's id (wish_id->title), or a ref Djinn computes
// (prompt::size, answer::delay). Long texts, such as a prompt or a context, are never columns. Every method only
// reads: the window, the command line and an agent's client run them freely.
service QueryService {
  // Read a collection as a table: the columns selected, the rows the filters keep, sorted, or one row per group when
  // aggregated. The window reads it in Arrow; the command line prints a table, or CSV with --format csv.
  rpc Query(QueryServiceQueryRequest) returns (QueryServiceQueryResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // List the refs of a collection: their type, label, unit, what each says, and where a jump leads. The window
  // builds its filters from it; djinn query schema tasks shows what a query can name.
  rpc Schema(QueryServiceSchemaRequest) returns (QueryServiceSchemaResponse) {
    option (djinn.v1.visibility) = VISIBILITY_PUBLIC;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Collection is a kind of stored entity a query reads.
enum Collection {
  // Not set: a query names one.
  COLLECTION_UNSPECIFIED = 0;
  // The tasks of every wish.
  COLLECTION_TASKS = 1;
  // The questions of every wish.
  COLLECTION_QUESTIONS = 2;
  // The wishes.
  COLLECTION_WISHES = 3;
  // The projects.
  COLLECTION_PROJECTS = 4;
}

// TaskType is what a task is, as the ref type of the tasks reads it: every task has one, where kind is set on a few.
// The first that fits wins, in the order of the values from azima down.
enum TaskType {
  // Not set: never served, a task always has a type.
  TASK_TYPE_UNSPECIFIED = 0;
  // Work a worker does, of no other type: what the lead or the developer spawns, and the question workers.
  TASK_TYPE_WORK = 1;
  // A correction worker, which Djinn starts when a merge conflicts or its tests fail (Task.correction).
  TASK_TYPE_CORRECTION = 2;
  // A review worker, which Djinn starts on a worktree left with changes not committed (Task.review).
  TASK_TYPE_REVIEW = 3;
  // An investigation: a short study that ends in a tilasm and a question (TASK_KIND_INVESTIGATION).
  TASK_TYPE_INVESTIGATION = 4;
  // A mockup, whose work is a tilasm (TASK_KIND_MOCKUP).
  TASK_TYPE_MOCKUP = 5;
  // An ifrit, a worker that stays lit while the developer is there (TASK_KIND_IFRIT).
  TASK_TYPE_IFRIT = 6;
  // A watcher: a command Djinn runs, no agent (PROVIDER_WATCH).
  TASK_TYPE_WATCHER = 7;
  // An azima, a part of the plan no worker runs (TASK_KIND_AZIMA): its times sum its parts'.
  TASK_TYPE_AZIMA = 8;
}

// Format is how a query's table comes back, in the table field of the response.
enum Format {
  // Not set: Arrow, as FORMAT_ARROW.
  FORMAT_UNSPECIFIED = 0;
  // An Arrow IPC stream, one record batch: the standard, what the window reads.
  FORMAT_ARROW = 1;
  // CSV, a header of refs then a line per row: an absent value is an empty cell.
  FORMAT_CSV = 2;
  // A table in text, aligned, its row count last: what the command line and djinn mcp ask, for a person or an agent
  // to read.
  FORMAT_TEXT = 3;
}

// ColumnType is the type of a column, taken from the proto, never from the values a row holds.
enum ColumnType {
  // Not set.
  COLUMN_TYPE_UNSPECIFIED = 0;
  // Text: Utf8 in Arrow.
  COLUMN_TYPE_STRING = 1;
  // A value of an enum, by its full name: Dictionary of Utf8 in Arrow.
  COLUMN_TYPE_ENUM = 2;
  // A whole number: Int64 in Arrow.
  COLUMN_TYPE_INT = 3;
  // A number with a fraction: Float64 in Arrow.
  COLUMN_TYPE_FLOAT = 4;
  // True or false: Bool in Arrow.
  COLUMN_TYPE_BOOL = 5;
  // An instant: Timestamp in milliseconds, UTC, in Arrow.
  COLUMN_TYPE_TIME = 6;
  // A length of time: Duration in milliseconds in Arrow.
  COLUMN_TYPE_DURATION = 7;
}

message QueryServiceQueryRequest {
  // The collection to read: tasks, questions, wishes or projects.
  Collection collection = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // The filters each row kept must hold, all of them.
  repeated Filter filter = 2 [(buf.validate.field).repeated.max_items = 50];
  // The order of the rows, the first sort before the next, then the default. The default never changes, so that a
  // test or a client may lean on it: the order the collection is stored in, by id, which is the order of creation;
  // when aggregated, the order of the groups' values. An absent value comes last either way.
  repeated Order sort = 3 [(buf.validate.field).repeated.max_items = 10];
  // The refs of the columns, in order: code, usage.cost_usd, wish_id->title. Not set: the collection's usual
  // columns.
  repeated string select = 4 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 200
      }
    }
  }];
  // Aggregate: a row per group of rows holding the same value of each of these refs.
  repeated GroupBy group_by = 5 [(buf.validate.field).repeated.max_items = 5];
  // Aggregate: the columns computed over each group's rows, absent values skipped.
  repeated Measure measure = 6 [(buf.validate.field).repeated.max_items = 20];
  // The most rows to return: the first ones, after the sorts. Not set: all of them.
  int32 limit = 7 [(buf.validate.field).int32.gte = 0];
  // How the table comes back: arrow when not set; the command line and djinn mcp ask text unless told csv or arrow.
  Format format = 8 [
    (buf.validate.field).enum.defined_only = true,
    (djinn.v1.client_default) = "text"
  ];
}

// Filter is one condition a row must hold: a comparison typed by the ref it reads, a group of filters, or a text the
// command line types. A null value holds for none but Null and StringIn with include_null. On a list, a filter holds
// when it holds for one of the list's values.
message Filter {
  oneof where {
    option (buf.validate.oneof).required = true;
    // Filters joined by an op.
    FilterGroup group = 1;
    // The ref's value is absent.
    NullFilter null = 2;
    // A true or false ref.
    BoolComparison bool = 3;
    // A text or an enum ref, compared ignoring case.
    StringComparison string = 4;
    // A text or an enum ref holding one of values.
    StringIn string_in = 5;
    // A number ref.
    NumberComparison number = 6;
    // A time ref.
    TimeComparison time = 7;
    // A duration ref.
    DurationComparison duration = 8;
    // A filter as the command line types it, read with the type of its ref: ref, an operator, a value. = is equal,
    // text ignoring case, and a|b one of; != is none of, an absent value included; > >= < <= bound a number, a time
    // (2026-11-01, or RFC 3339) or a duration (90s); *= contains, ^= begins with, ignoring case; null is the absent
    // value: status=null, status!=null, status=pending|null. An enum takes its value's name, prefix or not:
    // status=running.
    string text = 20 [
      (djinn.v1.text) = true,
      (buf.validate.field).string = {
        min_len: 2
        max_len: 2000
      }
    ];
  }
}

// FilterGroup joins filters: one at least.
message FilterGroup {
  // How they join: and when not set.
  FilterGroupOp op = 1 [(buf.validate.field).enum.defined_only = true];
  // The filters joined.
  repeated Filter filters = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 50
  }];
}

// FilterGroupOp is how a FilterGroup joins its filters.
enum FilterGroupOp {
  // Not set: and.
  FILTER_GROUP_OP_UNSPECIFIED = 0;
  // Every filter holds.
  FILTER_GROUP_OP_AND = 1;
  // One filter holds.
  FILTER_GROUP_OP_OR = 2;
  // The filters, joined as and, do not hold.
  FILTER_GROUP_OP_NOT = 3;
}

// NullFilter holds when the ref's value is absent.
message NullFilter {
  // The ref read.
  string ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
}

// BoolComparison holds when the ref's value is value; an absent value is not false.
message BoolComparison {
  // The ref read.
  string ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // The value it holds.
  bool value = 2;
}

// StringComparison compares a text or an enum ref with value, ignoring case. An enum takes its value's name, prefix
// or not: running.
message StringComparison {
  // The ref read.
  string ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // How it compares: equal when not set.
  StringOp op = 2 [(buf.validate.field).enum.defined_only = true];
  // The value compared with.
  string value = 3 [(buf.validate.field).string.max_len = 2000];
}

// StringOp is how a StringComparison compares.
enum StringOp {
  // Not set: equal.
  STRING_OP_UNSPECIFIED = 0;
  // Equal, ignoring case.
  STRING_OP_EQUAL = 1;
  // Contains value, ignoring case.
  STRING_OP_CONTAINS = 2;
  // Begins with value, ignoring case.
  STRING_OP_BEGINS_WITH = 3;
}

// StringIn holds when a text or an enum ref's value is one of values, ignoring case, or absent with include_null.
message StringIn {
  // The ref read.
  string ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // The values it may hold.
  repeated string values = 2 [(buf.validate.field).repeated.max_items = 200];
  // An absent value holds too.
  bool include_null = 3;
}

// NumberComparison compares a number ref with value; an absent value is not 0.
message NumberComparison {
  // The ref read.
  string ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // How it compares: equal when not set.
  CompareOp op = 2 [(buf.validate.field).enum.defined_only = true];
  // The value compared with.
  double value = 3;
}

// TimeComparison compares a time ref with value.
message TimeComparison {
  // The ref read.
  string ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // How it compares: equal when not set.
  CompareOp op = 2 [(buf.validate.field).enum.defined_only = true];
  // The time compared with.
  google.protobuf.Timestamp value = 3 [(buf.validate.field).required = true];
}

// DurationComparison compares a duration ref with value.
message DurationComparison {
  // The ref read.
  string ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // How it compares: equal when not set.
  CompareOp op = 2 [(buf.validate.field).enum.defined_only = true];
  // The duration compared with.
  google.protobuf.Duration value = 3 [(buf.validate.field).required = true];
}

// CompareOp is how a number, a time or a duration compares with a value: the ref on the left.
enum CompareOp {
  // Not set: equal.
  COMPARE_OP_UNSPECIFIED = 0;
  // Equal.
  COMPARE_OP_EQUAL = 1;
  // Greater than.
  COMPARE_OP_GREATER_THAN = 2;
  // Greater than or equal.
  COMPARE_OP_GREATER_THAN_EQUAL = 3;
  // Less than.
  COMPARE_OP_LESS_THAN = 4;
  // Less than or equal.
  COMPARE_OP_LESS_THAN_EQUAL = 5;
}

// Order is one sort of the rows: by a ref, or when aggregated by a column of the table (create_time::day, count).
message Order {
  // The ref, or the column, sorted by.
  string ref = 1 [(buf.validate.field).string.max_len = 200];
  // Descending: ascending when not set.
  bool desc = 2;
  // A sort as the command line types it, which stands for ref and desc: ref ascending, -ref descending.
  string text = 3 [
    (djinn.v1.text) = true,
    (buf.validate.field).string.max_len = 200
  ];
}

// GroupBy is one key of an aggregate: a row per value of its ref, by period for a time, by bins for a number or a
// duration.
message GroupBy {
  // The ref grouped by.
  string ref = 1 [(buf.validate.field).string.max_len = 200];
  // How its values are bucketed: each value its own group when not set.
  oneof bucket {
    // A time by period, in the machine's time zone.
    Period period = 2 [(buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }];
    // A number by bins.
    NumberBins number_bins = 3;
    // A duration by bins.
    DurationBins duration_bins = 4;
  }
  // A group as the command line types it, which stands for ref and bucket: ref, ref::day, ref::week, ref::month, or
  // ref::bins(b1,b2,…), answer::delay::bins(0s,1m,10m,1h).
  string text = 5 [
    (djinn.v1.text) = true,
    (buf.validate.field).string.max_len = 500
  ];
}

// Period is the bucket of a time a GroupBy groups by.
enum Period {
  // Not set.
  PERIOD_UNSPECIFIED = 0;
  // A day.
  PERIOD_DAY = 1;
  // A week, from Monday.
  PERIOD_WEEK = 2;
  // A month.
  PERIOD_MONTH = 3;
}

// NumberBins groups a number by bins: a value goes to the greatest bound at or below it, the first bound's when below
// them all; every bin shows, empty or not.
message NumberBins {
  // The bounds, ascending.
  repeated double bounds = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
  }];
}

// DurationBins groups a duration by bins, as NumberBins groups a number.
message DurationBins {
  // The bounds, ascending.
  repeated google.protobuf.Duration bounds = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
  }];
}

// Measure is one column of an aggregate, computed over each group's rows, absent values skipped.
message Measure {
  // The ref read: not set for a count of the rows.
  string ref = 1 [(buf.validate.field).string.max_len = 200];
  // The function: count when not set.
  MeasureFn fn = 2 [(buf.validate.field).enum.defined_only = true];
  // The column's name: fn, or ref::fn, when not set.
  string name = 3 [(buf.validate.field).string.max_len = 100];
  // A measure as the command line types it, which stands for ref, fn and name: count, ref::fn, or name=ref::fn to
  // name its column (running::median).
  string text = 4 [
    (djinn.v1.text) = true,
    (buf.validate.field).string.max_len = 200
  ];
}

// MeasureFn is the function of a Measure.
enum MeasureFn {
  // Not set: count.
  MEASURE_FN_UNSPECIFIED = 0;
  // The rows, or the values of the ref present.
  MEASURE_FN_COUNT = 1;
  // The sum.
  MEASURE_FN_SUM = 2;
  // The mean.
  MEASURE_FN_AVG = 3;
  // The least.
  MEASURE_FN_MIN = 4;
  // The greatest.
  MEASURE_FN_MAX = 5;
  // The median.
  MEASURE_FN_MEDIAN = 6;
  // The 90th percentile.
  MEASURE_FN_P90 = 7;
}

message QueryServiceQueryResponse {
  // The table, in the format asked: an Arrow IPC stream, CSV, or aligned text. In Arrow, one record batch: a column
  // per ref, its type from the proto, an absent value null, never 0; each field's metadata "djinn" holds a JSON
  // object: ref, label, unit and type, and for an aggregated column of, fn, granularity or bounds.
  bytes table = 1 [(djinn.v1.raw) = true];
  // The rows before the limit: the groups when aggregated.
  int64 total = 2 [(djinn.v1.json_only) = true];
}

message QueryServiceSchemaRequest {
  // The collection whose refs to list: tasks, questions, wishes or projects.
  Collection collection = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
}

// QueryColumn is one ref of a collection.
message QueryColumn {
  // How a query names it.
  string ref = 1;
  // A short label for a person.
  string label = 2;
  // Its type.
  ColumnType type = 3;
  // A list of values of its type.
  bool list = 4;
  // The unit of its numbers, when they have one: usd, tokens.
  string unit = 5;
  // What it holds, as the proto or Djinn says it.
  string doc = 6;
  // The collection whose id it holds: ref->x reads x there.
  Collection jump = 7;
  // The values of an enum, by their full names.
  repeated string values = 8;
}

message QueryServiceSchemaResponse {
  // The collection's own refs, then the ones Djinn computes.
  repeated QueryColumn columns = 1;
}
