# Generators run from the Go module (`go tool …`): nothing to install besides Go and Node.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/empowill/djinn/gen/go
  disable:
    - module: buf.build/bufbuild/protovalidate
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen/go
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen/go
    opt: paths=source_relative
  # TypeScript for the interface, from the npm development dependency @bufbuild/protoc-gen-es.
  # npx keeps it portable (Windows included); include_imports brings the protovalidate types.
  - local: ["npx", "protoc-gen-es"]
    out: gen/ts
    opt: target=ts
    include_imports: true
