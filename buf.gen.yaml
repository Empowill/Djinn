# Generators run from the Go module (`go tool …`): nothing to install besides Go and Node.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/empowill/djinn/gen/go
  disable:
    - module: buf.build/bufbuild/protovalidate
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen/go
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen/go
    opt: paths=source_relative
  # TypeScript for the interface, from the npm development dependency @bufbuild/protoc-gen-es.
  # npx keeps it portable (Windows included); include_imports brings the protovalidate types.
  - local: ["npx", "protoc-gen-es"]
    out: gen/ts
    opt: target=ts
    include_imports: true
  # docs/openapi.json, the OpenAPI document of the public methods: those of VISIBILITY_PUBLIC. The plugin reads only
  # google.api.visibility, so the internal ones are excluded by name; TestOpenAPI fails when this list lags behind
  # the protos. docs/openapi.base.yaml gives what the protos do not say.
  - local: ["go", "tool", "protoc-gen-connect-openapi"]
    out: docs
    strategy: all
    opt:
      - path=openapi.json
      - format=json
      - base=docs/openapi.base.yaml
      - features=connectrpc;protovalidate
      - content-types=json
      - allow-get
      - with-streaming
      - short-service-tags
      - short-operation-ids
      - trim-unused-types
    exclude_types:
      - backup.v1
      - demo.v1
      - terminal.v1
      - ui.v1
      - machine.v1.CommandService.Record
      - plan.v1.WishService.ImportData
      - plan.v1.WishService.Snapshot
      - plan.v1.TilasmService.PutData
