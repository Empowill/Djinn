# What this repository tells Djinn (djinn.v1.ProjectConfig), read on origin/main: docs/team-settings.md.

# The version of this file's schema: a Djinn that knows only lower versions refuses the file, rather than read it wrong.
version: 1

# The settings the team shares (plan.v1.ProjectSettings). Your own file, in Djinn's data folder, wins setting by setting.
settings:
  # Djinn integrates finished work by itself. npm ci makes a fresh worktree ready (ESLint, the protoc plugins); a
  # conflict only in what go tool task gen makes is settled by making it again.
  setup: npm ci
  generated: [gen/**]
  generate: go tool task gen

  # The lint before each task's work is committed; the whole test suite, too long for each commit, before each push.
  checks:
    - {name: lint, command: go tool task lint, when: commit}
    - {name: test, command: go tool task test, when: push}

  # Once pushed, the window proposes to install the build and restart on it.
  install: go tool task install
  # The window proposes each new build, to install or skip; Djinn never asks a question to install or restart in this
  # project (the developer, 11/10/2026).
  install_questions: never

  # By default Djinn merges main into each wish's branch once main holds a release the branch lacks, fetched at most
  # hourly (merge_main, merge_main_minutes), and a Djinn built from a checkout on main installs a newer release by
  # itself (install_releases): docs/team-settings.md#keeping-up-with-main.

# The gates of this repository (djinn.v1.ProjectGate), between its workers' own commands; the machine's bounds hold for
# every command besides. djinn project gates --off turns one off on your machine.
gates:
  # A time budget measures the machine as much as Djinn: an e2e run of the @budget cases holds the gate alone, the other
  # end-to-end and test runs share it, so that none of them runs while those cases measure (docs/pitfalls.md).
  - name: e2e
    alone:
      - go tool task e2e * @budget
    beside:
      - go tool task e2e
      - go tool task test
      - go tool task screenshots
      - npx playwright test
  # The real native window, on the developer's screen: one at a time.
  - name: window
    alone:
      - go tool task e2e-native
      - go tool task check-window
      - go test * ./e2e/native
