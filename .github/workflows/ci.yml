# Every pull request and every push to main: the same tasks a contributor runs (CONTRIBUTING.md), headless.
# No native window and no model here: tests build with -tags headless and replay recorded streams.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Lint and test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the headless browser of the end-to-end tests
        run: npx playwright install --with-deps chromium
      - run: go tool task lint
      # Go, interface and end-to-end tests (browser mode, headless Chromium).
      - run: go tool task test

  go:
    name: Go tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Windows is vetted, not yet run (plan T11): it reports without blocking until it is green once.
    continue-on-error: ${{ startsWith(matrix.os, 'windows') }}
    steps:
      # Keep the files as committed: gofmt and the golden files expect LF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # test-go builds the interface first: the djinn package embeds it.
      - run: go tool task test-go
