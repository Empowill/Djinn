# Every pull request and every push to main: the same tasks a contributor runs (CONTRIBUTING.md), headless.
# No native window and no model here: tests build with -tags headless and replay recorded streams.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # By hand on any branch, once this trigger is on main: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Lint and test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Cached below: setup-go saves only after a green job, and finds nothing once go.sum changes. A cold build
          # cache doubles the Go tests (550 s instead of 250 s), a test then passes 10 s, the job fails and saves
          # nothing again: every run after a go.sum change started cold, red.
          cache: false
      - id: go-env
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      # Go's modules and build cache, golangci-lint's own module too (the built linter: a minute or more to build).
      # A go.sum change restores the latest all the same, setup-go's last included (the same paths, in its order):
      # most of the build still holds.
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.mod }}
            ${{ steps.go-env.outputs.build }}
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'tools/golangci/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
            setup-go-Linux-x64-ubuntu24-go-${{ steps.go.outputs.go-version }}-
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the headless browser of the end-to-end tests
        run: npx playwright install --with-deps chromium
      # golangci-lint's analysis cache: about 40 s cold, a few seconds warm. Saved each run, restored from the latest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: golangci-lint-${{ runner.os }}-
      - run: go tool task lint
      # Go, interface and end-to-end tests (browser mode, headless Chromium), the three at once; the end-to-end on
      # two workers, two djinns (e2e/playwright.config.ts reads CI).
      - run: go tool task test
      # cmd/djinn and its tests vet for Windows and macOS (TestCrossVet), here where a red blocks: the Windows job does
      # not. Behind a tag, out of the push check: 48 s on a cold build cache.
      - run: go test -tags headless,crossvet -run '^TestCrossVet$' ./cmd/djinn
      - name: Keep the output of each part and the traces of the end-to-end tests that failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-linux
          path: |
            test-results/*.log
            test-results/e2e
          if-no-files-found: ignore
          retention-days: 7
      # Saved red or green, once per go.sum: the next run does not start cold.
      - if: ${{ !cancelled() && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.mod }}
            ${{ steps.go-env.outputs.build }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  macos:
    name: Go tests (macos-15)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # Keep the files as committed: the golden files expect LF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # test-go builds the interface first: the djinn package embeds it.
      - run: go tool task test-go

  # Every test a contributor runs (go tool task test), in three steps that each report even when one before fails.
  # The end-to-end tests drive the browser mode in headless Chromium: no native window. The specs that need a POSIX
  # shell skip, and say why.
  windows:
    name: Tests (Windows)
    runs-on: windows-2025
    timeout-minutes: 40
    # It reports without blocking until it is green once (plan T11); then this line goes.
    continue-on-error: true
    # Only the tests that target the system, and the smoke of the portable logic that Linux and macOS prove whole:
    # testx.Portable and e2e/portable.ts skip the others (CONTRIBUTING.md).
    env:
      DJINN_TEST_SYSTEM_ONLY: "1"
    steps:
      # Keep the files as committed: the golden files expect LF. Worktrees nest deep paths.
      - run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the headless browser of the end-to-end tests
        run: npx playwright install chromium
      # test-go builds the interface first: the djinn package embeds it.
      - run: go tool task test-go
      - if: ${{ !cancelled() }}
        run: go tool task test-ui
      # Retries a failed test once on Windows (e2e/playwright.config.ts, temporary until Q108 is fixed) and lists the
      # tests that passed on retry (Playwright flaky status) in $GITHUB_STEP_SUMMARY (e2e/reporter.ts).
      - if: ${{ !cancelled() }}
        run: go tool task e2e
      - name: Keep the traces and screenshots of the end-to-end tests that failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-windows
          path: test-results/e2e
          if-no-files-found: ignore
          retention-days: 7
