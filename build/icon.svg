<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- Djinn's icon, plain enough to read at 16 px: one brass lamp, solid, of straight lines and exact arcs, and one thick
     curl of smoke rising from its spout. build/icon.png is this drawing at 1024 px (tools/icons); the earlier, richer
     drawing is build/icon-alt-detailed.svg. -->
<defs>
<linearGradient id="ground" x2="1" y2="1"><stop stop-color="#262636"/><stop offset="1" stop-color="#121218"/></linearGradient>
<linearGradient id="brass" x1="0" y1="226" x2="0" y2="460" gradientUnits="userSpaceOnUse"><stop stop-color="#ffdb8a"/><stop offset="1" stop-color="#c4852b"/></linearGradient>
<linearGradient id="smoke" x1="440" y1="226" x2="170" y2="70" gradientUnits="userSpaceOnUse"><stop stop-color="#b9adff"/><stop offset=".45" stop-color="#e9e4ff"/><stop offset="1" stop-color="#9483ff"/></linearGradient>
</defs>
<rect x="8" y="8" width="496" height="496" rx="112" fill="url(#ground)"/>
